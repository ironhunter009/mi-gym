<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Gym</title>
<meta name="description" content="Ejercicios por zona con pasos en español, consejos de técnica y tu rutina semanal.">
<meta name="theme-color" content="#eef0ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Gym">
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: app de una columna, pestañas fijas abajo; zonas como "placas" de gimnasio, ejercicios como filas escaneables. */
:root{
  --bg:#eef0ee; --surface:#ffffff; --surface2:#e4e7e4; --line:#d3d7d3;
  --ink:#16191d; --muted:#5d6670; --accent:#c8321e; --accent-ink:#ffffff; --accent-soft:#f6dcd6;
  --ok:#1f7a4d; --warn:#9a5a00;
  --act:#1f6fb2; --act-ink:#ffffff; --act-soft:#dce9f6;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1b1e23; --surface2:#252a30; --line:#30363e;
  --ink:#eef0f2; --muted:#9aa3ad; --accent:#ff6b4f; --accent-ink:#1a0b07; --accent-soft:#3a1f19;
  --ok:#5fd39a; --warn:#ffb85c; --act:#5aaef0; --act-ink:#06121c; --act-soft:#16283a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1b1e23; --surface2:#252a30; --line:#30363e;
  --ink:#eef0f2; --muted:#9aa3ad; --accent:#ff6b4f; --accent-ink:#1a0b07; --accent-soft:#3a1f19;
  --ok:#5fd39a; --warn:#ffb85c; --act:#5aaef0; --act-ink:#06121c; --act-soft:#16283a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:34px;font-weight:800;line-height:1;text-transform:uppercase}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:22px;font-weight:700;text-transform:uppercase;margin:28px 0 12px}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}

/* zonas */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:96px;justify-content:space-between;transition:border-color .12s,transform .12s}
.zone:hover{border-color:var(--accent);transform:translateY(-1px)}
.zone b{font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;line-height:1.05}
.zone .cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.zone .mus{color:var(--muted);font-size:12px;line-height:1.3}
.zones.pair{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.zone.sp{border-left:4px solid var(--accent)}
.zone .when{display:block;font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px}
.plan h4{font-size:16px;font-weight:700;text-transform:uppercase;margin-bottom:4px}
.plan ol{margin:0;padding-left:20px}
.plan li{margin:4px 0;font-size:15px}
.sugg{background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);padding:12px 14px;margin-bottom:6px}
.sugg .when{display:block;font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}

/* chips y filtros */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;max-width:100%}
label.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}

/* lista de ejercicios */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.ex{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px 12px 14px;text-align:left;min-width:0}
.ex:hover{border-color:var(--accent)}
.ex{padding-left:8px}
.th{width:64px;height:64px;flex:none;border-radius:10px;background:var(--surface2);object-fit:cover;max-width:100%}
.th.ok{background:#fff}
.th.sm{width:48px;height:48px;cursor:pointer}
.anim{background:#fff;border-radius:14px;margin:12px auto 0;width:100%;max-width:300px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.anim .muted{color:#5d6670;padding:16px;text-align:center}
.gif{width:100%;height:100%;object-fit:contain;display:block}
.ex .info{flex:1;min-width:0}
.en{color:var(--muted);font-size:12px;font-style:italic;text-transform:capitalize;overflow-wrap:anywhere}
.ex .nm{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.ex .meta{color:var(--muted);font-size:13px;margin-top:2px}
.ex .fav{background:none;border:0;font-size:20px;color:var(--muted);padding:6px;line-height:1}
.ex .fav.on{color:var(--accent)}
.count{color:var(--muted);font-size:13px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.more{display:block;margin:16px auto;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.empty{padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--radius);border:1px dashed var(--line)}
.back{background:none;border:0;color:var(--accent);padding:0;margin-bottom:10px;font-weight:600}

/* detalle */
.sheet{position:fixed;inset:0;background:rgba(10,12,14,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet{overscroll-behavior:contain}
.sheet-open nav.tabs{visibility:hidden}
.sheet .box{background:var(--surface);width:100%;max-width:720px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .2s ease-out}
@media(min-width:780px){.sheet{align-items:center}.sheet .box{border-radius:20px;padding:22px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet .box{animation:none}.zone{transition:none}}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hd h3{font-size:28px;font-weight:700;text-transform:none;font-size:26px;line-height:1.05}
.x{background:var(--surface2);border:0;border-radius:999px;width:38px;height:38px;font-size:18px;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.a{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.rx div{background:var(--surface2);border-radius:12px;padding:10px 6px;text-align:center}
.rx b{display:block;font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.rx span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 11px;font-size:14px;font-weight:500}
.dlg{margin-top:10px;background:var(--surface2);border-radius:12px;padding:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
h4.sec{font-size:18px;font-weight:700;text-transform:uppercase;margin:22px 0 6px}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:0}
ol.steps li{counter-increment:s;position:relative;padding:9px 0 9px 40px;border-bottom:1px solid var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:999px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:700;display:grid;place-items:center}
.tips{border-left:3px solid var(--ok);padding:4px 0 4px 14px;margin-top:16px}
.tips h4{font-size:16px;font-weight:700;text-transform:uppercase;color:var(--ok);margin-bottom:4px}
.tips.warn{border-color:var(--warn)}
.tips.warn h4{color:var(--warn)}
.tips ul{margin:0;padding-left:18px}
.tips li{margin:4px 0}

/* rutina */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.day h4{font-size:20px;font-weight:700;text-transform:uppercase}
.ritem{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dh + .ritem{margin-top:8px}
.ritem input{width:22px;height:22px;flex:none}
.ritem .info{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.ritem .info b{display:block;font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.ritem.done .info b{text-decoration:line-through;color:var(--muted)}
.ib{background:none;border:0;color:var(--muted);font-size:18px;padding:6px}
.progress{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent)}
.day.nx{border-color:var(--accent)}
.ph{display:flex;flex-direction:column;gap:1px;width:100%;background:none;border:0;padding:0;text-align:left}
.ph .when{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.ph b{font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;line-height:1.1}
.ph + .ritem{margin-top:8px}
.btn:disabled{opacity:.45;cursor:default}
.rev{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.rev h5{font-family:var(--f-display);font-size:16px;font-weight:700;text-transform:uppercase;margin:14px 0 4px}
.rev .cov{margin:0;padding-left:18px;font-size:14px}
.rev .cov li{margin:3px 0;overflow-wrap:anywhere}
.rev .cov b{text-transform:none}
.rev .wk{list-style:none;margin:0;padding:0;font-size:14px}
.rev .wk li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.gap{margin-top:8px}
.gap p{margin:1px 0 2px}
.srow{display:flex;align-items:center;gap:10px;padding:6px 0;min-width:0}
.srow .info{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;display:flex;flex-direction:column}
.srow .info b{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.ritem{flex-wrap:wrap}
.rlog{flex-basis:100%;display:flex;align-items:center;gap:10px;min-width:0}
.ritem.swapped{box-shadow:inset 3px 0 0 var(--act);padding-left:8px}
.swapnote{justify-content:space-between;flex-wrap:wrap;color:var(--act)}
.swapnote b{color:var(--ink)}
.swapbox{flex-basis:100%;width:100%;min-width:0;background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:4px}
.swapbox .tog{align-items:flex-start}
.swapbox .srow .btn{flex:none}

/* registro y progreso */
.logbox{background:var(--surface2);border-radius:12px;padding:12px}
.logtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logbox input{min-width:0;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.logtop input{width:auto}
.logtop{flex-wrap:wrap}
.unit{display:flex;gap:4px;margin-left:auto}
.unit .chip{padding:5px 10px}
.lsets{display:grid;gap:6px 8px;align-items:center;margin-top:10px}
.lsets.time{grid-template-columns:20px minmax(0,1fr) 32px}
.lh{font-size:12px;color:var(--muted)}
.ln-n{font-family:var(--f-display);font-weight:700;text-align:center}
/* tipos de serie */
.lsets.weight{grid-template-columns:30px minmax(0,1fr) 12px minmax(0,1fr) 32px}
.ln-n.st{padding:4px 0;border:1px dashed var(--line);border-radius:8px;background:none;font-size:15px;line-height:1.1;min-height:32px}
.ln-n.st.t-c{border-style:solid;color:var(--muted)}
.ln-n.st.t-d,.ln-n.st.t-rp,.ln-n.st.t-f{border-style:solid;border-color:var(--accent);color:var(--accent);font-size:13px}
.ln-n.drop{color:var(--muted);font-weight:400}
.rpw{text-align:right;line-height:1.1}
.stypes{grid-column:1/-1;background:var(--surface2);border-radius:10px;padding:8px}
.stypes .chips{flex-wrap:wrap;overflow:visible}
.dropadd{grid-column:2/-1;justify-self:start}
.nextmode{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.nextmode .chips{margin:0}
.nextmode .chip{padding:5px 10px}
/* superseries */
.ss{border-left:3px solid var(--accent);padding-left:10px;margin:8px 0 2px;border-radius:2px}
.ssh{display:flex;flex-direction:column;padding:8px 0 2px}
.ssh b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.link{display:block;width:100%;background:none;border:0;border-top:1px dashed var(--line);color:var(--muted);font-size:12px;padding:6px 0;text-align:center}
.link.on{border-top-style:solid}
.ss + .ritem,.link + .ritem{border-top:0}
.ssbar{background:var(--accent-soft);border-radius:10px;padding:10px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
/* tipos de rutina */
.splitbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.split{margin:0 0 14px;border:1px solid var(--accent);background:var(--surface)}
.split .ttl{font-family:var(--f-display);font-size:20px;text-transform:uppercase}
.splits{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.splitopt{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.splitopt b{font-weight:700}
.splitopt span{font-size:13px;color:var(--muted);line-height:1.3}
.splitopt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.undo{background:var(--surface2);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;max-width:100%}
.grid{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.val{fill:var(--ink);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.xh{stroke:var(--muted);stroke-width:1}
.tip{position:absolute;top:0;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:3px 8px;border-radius:8px;white-space:nowrap;pointer-events:none}
.wkstrip{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.wkdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:10px 0 8px}
.wd{display:grid;place-items:center;aspect-ratio:1;max-width:40px;width:100%;margin:0 auto;border-radius:999px;background:var(--surface2);color:var(--muted);font-family:var(--f-display);font-weight:700}
.wd.gym,.cd.gym{background:var(--accent);color:var(--accent-ink);font-weight:700}
.wd.act,.cd.act{background:var(--act);color:var(--act-ink);font-weight:700}
.wd.both,.cd.both{background:linear-gradient(135deg,var(--accent) 50%,var(--act) 50%);color:#fff;font-weight:700;text-shadow:0 0 2px rgba(0,0,0,.6)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin:8px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.sw.gym{background:var(--accent)}
.sw.act{background:var(--act)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:600;line-height:1.5;margin:2px 0}
.pill.gym{background:var(--accent-soft);color:var(--ink)}
.pill.act{background:var(--act-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--act)}
.didrow{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.day.did{border-color:var(--act)}
.didit{background:var(--surface);border:1px solid var(--act);border-radius:var(--radius);padding:10px 14px;margin-top:14px}
.didit .when{display:block;font-size:12px;font-weight:600;color:var(--act);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.fl.act{border-top-color:var(--line);box-shadow:inset 3px 0 0 var(--act);padding-left:10px}
.wd.today{box-shadow:0 0 0 2px var(--ink)}
.wklist{list-style:none;margin:0 0 10px;padding:0;font-size:14px}
.wklist li{padding:3px 0;overflow-wrap:anywhere}
.rx.stats3{margin-top:6px}
.rx.stats3 span{letter-spacing:.02em;line-height:1.2;display:block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:360px}
.cal .ch{text-align:center;font-size:12px;color:var(--muted)}
.cd{aspect-ratio:1;border:0;border-radius:8px;background:var(--surface2);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding:0}
.cd.today{box-shadow:0 0 0 2px var(--ink)}
.cd:disabled{cursor:default}
.feed{display:flex;flex-direction:column;gap:8px}
.fday{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;scroll-margin-top:12px}
.fh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.fh b{font-family:var(--f-display);font-size:18px;text-transform:uppercase}
.fl{display:flex;flex-direction:column;width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;padding:7px 0;margin-top:6px;min-width:0}
.fl .fn{font-weight:600;overflow-wrap:anywhere}
button.fh{width:100%;background:none;border:0;padding:0;text-align:left}
.go{color:var(--accent);font-weight:600}
/* inicio */
.hero{background:var(--surface);border:1px solid var(--accent);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.hero .when{display:block;font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.hero > b{display:block;font-family:var(--f-display);font-size:26px;font-weight:700;text-transform:uppercase;line-height:1.05;margin:2px 0 4px}
.hero.live{background:var(--accent-soft)}
.lastlist{list-style:none;margin:8px 0 0;padding:0}
.lastlist li{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.lastlist li span:first-child{overflow-wrap:anywhere;min-width:0}
.lastlist li span:last-child{flex:none;text-align:right;font-variant-numeric:tabular-nums}
.lastwk{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.lastwk .when{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lastwk b{font-family:var(--f-display);font-size:20px;text-transform:uppercase}
.wkstrip{margin-top:0}
/* agregar ejercicio en el lugar */
.picker{background:var(--surface2);border-radius:12px;padding:10px;margin-top:10px}
.picker .srow .btn{flex:none;min-width:40px;justify-content:center}
/* terminar entreno */
.finish{border:1px solid var(--accent);background:var(--surface)}
.finish .ttl{font-family:var(--f-display);font-size:20px;text-transform:uppercase}
.chg{margin:0;padding-left:18px}
.chg li{margin:2px 0}
/* ficha del día */
.fl.dx{gap:3px}
.day > .fl:first-child{border-top:0;margin-top:0;padding-top:0}
.fl.dx .set{display:inline-block;margin-right:10px;font-variant-numeric:tabular-nums}
.cmp{color:var(--muted)}
.cmp.up,.up{color:var(--ok)}
.cmp.down,.down{color:var(--warn)}
.cmp.new{color:var(--act)}
.note{display:block;font-style:italic;color:var(--ink);margin-top:2px;overflow-wrap:anywhere}
.logbox textarea{width:100%;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;resize:vertical;margin-top:4px}
.actform{margin:4px 0 10px}
.actform input{display:block;margin-top:4px}
.actgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.actgrid label:first-child{grid-column:1/-1}
.actgrid label{min-width:0}
.lhist{margin-top:8px}
.lrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.lrow .info{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;display:flex;flex-direction:column}
.spark{flex:none;margin-right:6px}
.spark .dot{stroke:var(--surface)}

/* perfil */
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.form label.f{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.form label.f:first-child{margin-top:0}
.form input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:99px;background:var(--muted)}
.sync.on i{background:var(--ok)}

.gt{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.gt div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.gt b{display:block;font-family:var(--f-display);font-size:18px;text-transform:uppercase;margin-bottom:4px}
.gt span{color:var(--muted);font-size:14px}

/* pestañas */
nav.tabs{transform:translateZ(0);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;padding:10px 2px 12px;color:var(--muted);font-family:var(--f-display);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-top:3px solid transparent}
nav.tabs button.on{color:var(--ink);border-top-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1}
.resting .toast{bottom:calc(136px + env(safe-area-inset-bottom,0px))}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);padding:6px 6px 6px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.rest .rt{margin-right:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rest .rt b{font-family:var(--f-display);font-size:22px;margin-left:4px}
.rest button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:999px;padding:6px 10px;font-weight:600;opacity:.85}
.rest.done{background:var(--accent);color:var(--accent-ink)}
.foot{margin-top:24px;color:var(--muted);font-size:13px}
.foot a{color:var(--accent)}

const MEDIA = 'https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/7455efae41b330c265e7cd4b78dfa848e7ce5ebd/';
const thumbUrl = e => MEDIA + 'images/' + e.m + '.jpg';
const gifUrl = e => MEDIA + 'videos/' + e.m + '.gif';
const thumbObserver = 'IntersectionObserver' in window ? new IntersectionObserver(entries=>{
  for(const en of entries){ if(en.isIntersecting){ thumbObserver.unobserve(en.target); loadThumb(en.target); } }
}, {rootMargin:'300px'}) : null;
function loadThumb(img){
  const e = byId[img.dataset.th]; if(!e) return;
  img.onload = () => img.classList.add('ok');
  img.crossOrigin = 'anonymous';
  img.src = thumbUrl(e);
}

/* Almacenamiento: imágenes guardadas por el service worker (caché "migym-media-v1") */
const MEDIA_CACHE = 'migym-media-v1';
async function mediaStats(){
  if(!('caches' in window) || !(await caches.has(MEDIA_CACHE))) return {gifs:0, thumbs:0, bytes:0};
  const c = await caches.open(MEDIA_CACHE), reqs = await c.keys();
  let gifs = 0, thumbs = 0, bytes = 0;
  for(const r of reqs){
    if(r.url.endsWith('.gif')) gifs++; else thumbs++;
    const res = await c.match(r);
    bytes += Number(res && res.headers.get('content-length')) || 0;
  }
  return {gifs, thumbs, bytes};
}
async function showMediaStats(){
  const el = $('#mediaInfo'); if(!el) return;
  const s = await mediaStats();
  if(!$('#mediaInfo')) return;
  const mb = s.bytes / 1048576;
  el.textContent = (s.gifs + s.thumbs)
    ? `${s.gifs} ${s.gifs===1?'animación':'animaciones'} y ${s.thumbs} miniatura${s.thumbs===1?'':'s'} guardadas · ${mb < 0.1 ? '<0,1' : mb.toFixed(1).replace('.', ',')} MB`
    : 'No hay animaciones guardadas.';
  $('#mediaClear').disabled = !(s.gifs + s.thumbs);
}
function hydrateThumbs(root){
  root.querySelectorAll('img[data-th]:not(.ok)').forEach(img => thumbObserver ? thumbObserver.observe(img) : loadThumb(img));
}

          avoid:['Rebotar para llegar más lejos.','Forzar una articulación o estirar con dolor agudo.','Contener la respiración.']},
    groups:[
      {name:'Piernas', ids:['1512','1713','1548','1564','0613','1560','1511','1576','1585','1599','1708','1407','1377','1378','1388','1389','1390','1398','1712','1494','1582']},

const KIND = {};

/* Calentamiento y elongación sugeridos según el tipo de sesión.
   Calentamiento: para qué sesiones sirve cada ejercicio (e empuje, t tirón, p pierna; sin marca = cualquiera). */
const WARM_FOR = {'1685':'p','1686':'p','1687':'p','1688':'p','1460':'p','3655':'p','0628':'p','3561':'p','3013':'p','1422':'p',
  '3021':'e','3011':'e','0688':'t','0235':'et','0863':'et','1017':'t',
  '1368':'p','0257':'p','1428':'et','1418':'p','1167':'e','3147':'p','1364':'p'};
const FOCUS_LETTER = {empuje:'e', tiron:'t', pierna:'p', torso:'et', completo:'etp', libre:'etp',
  pecho:'e', espalda:'t', hombros:'e', brazos:'et', gluteos:'p'};
const STRETCH_FOR = {empuje:['Pecho y hombros','Brazos'], tiron:['Espalda','Brazos','Pecho y hombros'], pierna:['Piernas','Glúteos y cadera','Espalda'],
  torso:['Pecho y hombros','Espalda','Brazos'], completo:['Piernas','Glúteos y cadera','Espalda','Pecho y hombros'], libre:['Piernas','Glúteos y cadera','Espalda','Pecho y hombros'],
  pecho:['Pecho y hombros','Brazos'], espalda:['Espalda','Brazos'], hombros:['Pecho y hombros','Espalda'], brazos:['Brazos','Pecho y hombros'], gluteos:['Glúteos y cadera','Piernas','Espalda']};
function suggestSpecial(kind, focus){
  const groups = SPECIAL[kind].groups, ok = id => byId[id] && equipOk(byId[id]);
  if(kind==='calentamiento'){
    const L = FOCUS_LETTER[focus] || 'etp', fits = id => !WARM_FOR[id] || [...WARM_FOR[id]].some(c=>L.includes(c));
    /* primero los específicos de esa sesión, después los generales */
    const pick = (name, n) => groups.find(g=>g.name===name).ids.filter(id=>ok(id) && fits(id))
      .sort((a,b)=>(WARM_FOR[a]?0:1)-(WARM_FOR[b]?0:1)).slice(0, n);
    return [...pick('Cardio suave',1), ...pick('Movilidad',2), ...pick('Activación',3)];
  }
  /* primero los que se hacen sin implementos */
  const bw = id => byId[id].q==='body weight' ? 0 : 1;
  const names = STRETCH_FOR[focus] || STRETCH_FOR.libre, lists = names.map(n=>groups.find(g=>g.name===n).ids.filter(ok).sort((a,b)=>bw(a)-bw(b)));
  const out = [];
  for(let i=0; out.length<5 && i<6; i++) for(const l of lists) if(l[i] && out.length<5 && !out.includes(l[i])) out.push(l[i]);
  return out;
}

function prescription(e){
  const p = state.profile, k = KIND[e.i];
  if(k && k.kind==='calentamiento') return k.group==='Cardio suave'
    ? {sets:'1', reps:'3–5′', rest:'Suave', restLabel:'Ritmo', unit:'Duración'}
    : {sets:'1', reps:'30–45 s', rest:'Sin pausa', unit:'Tiempo'};
  if(k && k.kind==='elongacion') return {sets:'2', reps:'20–30 s', rest:'Ambos', restLabel:'Lados', unit:'Mantener'};
  if(e.c==='cardio') return {sets:p.level==='principiante'?'1':'1–2', reps:p.goal==='perder'?'20–30′':'10–20′', rest:'Constante', unit:'Duración'};
  const g = GOALS[p.goal] || GOALS.hipertrofia;
  return {sets:p.level==='principiante'?g.sets.split('–')[0]:g.sets, reps:g.reps, rest:g.rest, unit:'Reps'};
}

function normalize(s){
  const base = fresh();
  if(!s || typeof s!=='object') return base;
  return {
    profile:Object.assign(base.profile, s.profile||{}),
    favs:Array.isArray(s.favs)?s.favs:[],
    routine:Object.assign(base.routine, s.routine||{}),
    log:(s.log && typeof s.log==='object')?s.log:{},
    acts:Array.isArray(s.acts)?s.acts:[],
    units:(s.units && typeof s.units==='object')?s.units:{},
    workouts:Array.isArray(s.workouts)?s.workouts:[],
    active:typeof s.active==='string'?s.active:null,
    routineMode:s.routineMode==='sesiones'?'sesiones':'semana',
    planLog:Array.isArray(s.planLog)?s.planLog:[],
    plans:Array.isArray(s.plans)?s.plans:base.plans,
    links:(s.links && typeof s.links==='object')?s.links:{},
    plansPrev:s.plansPrev && Array.isArray(s.plansPrev.plans)?s.plansPrev:null,
    archived:Array.isArray(s.archived)?s.archived:[]

}

function restoreCode(code){
  const s = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
  if(!s || !s.routine) throw new Error('formato');
  /* los códigos antiguos no traen estos datos: se conservan los de este dispositivo */
  for(const k of ['log','acts','units','plans','planLog','routineMode','links','archived','workouts','active']) if(!s[k]) s[k] = state[k];

/* Un ejercicio de una lista. En la rutina (plantilla) se edita; en un entreno se marca, se registra

function routineItem(d, id){

    <button class="ib" data-swap="${esc(slot)}" aria-label="Cambiar por un ejercicio equivalente" aria-expanded="${swapOpen===slot}">⇄</button>
    <button class="ib" data-up="${esc(slot)}" aria-label="Subir">↑</button>
    <button class="ib" data-rm="${esc(slot)}" aria-label="Quitar">✕</button>
    ${orig?`<div class="rlog swapnote"><span class="small">En vez de <b>${esc(dn(orig))}</b></span><button class="btn sm" data-unswap="${esc(slot)}">Volver al original</button></div>`:''}
    ${w && logType(e) ? `<div class="rlog"><button class="btn sm ${done?'':'pri'}" data-log="${e.i}|${esc(d)}|${id}">Registrar</button><span class="small muted">${esc(line)}</span></div>`
      : !w && line ? `<div class="rlog"><span class="small muted">${esc(line)}</span></div>` : ''}
    ${swapOpen===slot ? swapHTML(d, id, !!w) : ''}</div>`;
}
/* reemplaza el ejercicio i de una lista (y mueve su unión de superserie) */
function replaceIn(key, list, i, alt){
  if(list.includes(alt)){ unlinkRemoved(key, list, i); list.splice(i,1); return; }
  const id = list[i];
  if(state.links[linkKey(key,id)]){ delete state.links[linkKey(key,id)]; state.links[linkKey(key,alt)] = true; }
  list[i] = alt;
}

/* ---------- Superseries ----------
   Una lista (día o sesión) se divide en bloques: los ejercicios unidos se hacen uno tras otro, sin
   descanso entre ellos, y se descansa al terminar la vuelta. 2 = superserie, 3 = triserie, 4+ = circuito. */
const linkKey = (key, id) => `${key}|${id}`;
function blocks(key, ids){
  const out = []; let cur = [];
  ids.forEach((id, i)=>{ cur.push(id); if(!(state.links[linkKey(key,id)] && i<ids.length-1)){ out.push(cur); cur = []; } });
  return out;
}
const groupOf = (key, id) => blocks(key, listOf(key) || []).find(b=>b.includes(id)) || [id];
const blockName = n => n===2 ? 'Superserie' : n===3 ? 'Triserie' : 'Circuito';
const shownId = (key, id) => id;
function itemsHTML(key, ids, edit = true){
  const all = blocks(key, ids);
  return all.map((b, bi)=>{
    const join = edit && bi<all.length-1 ? `<button class="link" data-link="${esc(key)}|${b[b.length-1]}">＋ Unir en superserie con el siguiente</button>` : '';
    if(b.length<2) return routineItem(key, b[0]) + join;
    return `<div class="ss"><div class="ssh"><b>${blockName(b.length)}</b><span class="small muted">Uno tras otro, sin descanso. Descansa al terminar la vuelta.</span></div>
      ${b.map((id,i)=>routineItem(key,id) + (edit && i<b.length-1 ? `<button class="link on" data-link="${esc(key)}|${id}">Separar</button>` : '')).join('')}</div>${join}`;
  }).join('');
}
/* al quitar o reemplazar un ejercicio, sus uniones se arreglan */
function unlinkRemoved(key, list, i){
  const id = list[i], prev = list[i-1];
  if(prev && state.links[linkKey(key,prev)] && !state.links[linkKey(key,id)]) delete state.links[linkKey(key,prev)];
  delete state.links[linkKey(key,id)];
}

/* ---------- Ejercicios equivalentes (máquina ocupada, otro equipo) ----------
   Mismo patrón de movimiento y músculo; primero los más habituales, variando el equipo. */
let swapOpen = null, swapForever = false, swapPick = null;
function alternativesFor(e, n = 6){
  const k = KIND[e.i], p = Coach.patternOf(e), staple = Object.values(Coach.STAPLES).flat();
  const same = k ? x => KIND[x.i] && KIND[x.i].group===k.group
    : p ? x => Coach.patternOf(x)?.id===p.id && !KIND[x.i]
    : x => x.t===e.t && x.c===e.c && !KIND[x.i];
  const rank = x => {
    const si = staple.indexOf(x.i);
    return (si>=0 ? si/1000 : 1) + (x.t===e.t ? 0 : .5) + (x.q===e.q ? .3 : 0)
      + (/\(female\)|v\. ?\d|pov|one arm|single|alternat|kneeling|bosu|stability|exercise ball/.test(x.n) ? .6 : 0) + x.n.length/1000;
  };
  const list = EX.filter(x => x.i!==e.i && same(x) && equipOk(x)).sort((a,b)=>rank(a)-rank(b));
  /* máximo 2 por tipo de equipo, para que haya opciones distintas */
  const out = [], perEq = {};
  for(const x of list){ if(out.length>=n) break; if((perEq[x.q]||0) >= 2) continue; perEq[x.q] = (perEq[x.q]||0)+1; out.push(x); }
  return out;
}
function swapHTML(d, id, isToday){
  const e = byId[id], alts = alternativesFor(e);
  return `<div class="swapbox">
    <p class="small" style="margin:0 0 4px"><b>Cambiar ${esc(dn(e))} por:</b></p>
    ${isToday ? (wkById(d.slice(2))||{}).key ? `<label class="tog"><input type="checkbox" id="swapForever" data-swapforever ${swapForever?'checked':''}> Cambiarlo también en la rutina (no solo en este entreno)</label>` : ''
      : `<p class="small muted" style="margin:0">Se reemplaza en la rutina.</p>`}
    ${alts.length ? alts.map(x=>`<div class="srow"><img class="th sm" data-th="${x.i}" data-open="${x.i}" alt="">
      <button class="info" data-open="${x.i}"><b>${esc(dn(x))}</b><span class="muted small">${esc(tr(EQUIP,x.q))}${x.t!==e.t?` · ${esc(tr(TARGET,x.t))}`:''}</span></button>
      <button class="btn sm" data-swapto="${esc(d)}|${id}|${x.i}|${isToday?1:0}">Elegir</button></div>`).join('')
      : `<p class="small muted">No encontré equivalentes con tu equipamiento. Revísalo en Perfil.</p>`}
    <div class="row" style="margin-top:4px"><button class="btn sm" data-swapsearch="${esc(d)}|${id}|${isToday?1:0}">Buscar otro</button><button class="btn sm" data-swap="${esc(d)}|${id}">Cerrar</button></div>
  </div>`;
}
function logLine(id){
  const ss = sessions(id); if(!ss.length) return '';
  const last = ss[ss.length-1];
  return last.d===isoDate() ? `Hoy: ${last.s.length} ${last.s.length===1?'serie':'series'}` : `Última vez: ${setText(bestSet(last))}`;
}
/* ---------- Rutina por sesiones ---------- */
const planById = id => state.plans.find(p=>p.id===id);
/* también las sesiones de un tipo de rutina anterior, para que el historial conserve sus nombres */
const planInfo = id => planById(id) || state.archived.find(a=>a.id===id);
const planLabel = p => `Día ${state.plans.indexOf(p)+1}`;
const lastDone = id => [...state.planLog].reverse().find(x=>x.id===id);
/* "key" de una lista: id de sesión (p…), nombre de día (Lunes…) o "w:<id>" para un entreno */
const listOf = key => isWk(key) ? (wkById(key.slice(2))||{}).ids : (planById(key) || {ids:state.routine[key]}).ids;
const listName = key => { if(isWk(key)) return 'el entreno de hoy'; const p = planById(key); return p ? `${planLabel(p)} · ${p.name}` : key; };

/* ---------- Entrenos ----------
   La rutina es la plantilla. Al tocar "Empezar entreno" se copia la sesión que toca en un entreno propio:
   lo que se quite, agregue, cambie u ordene ahí no toca la rutina. Al terminar, si hubo cambios, se
   pregunta si pasarlos también a la rutina. Cada entreno queda guardado (fecha, hora, ejercicios). */
const isWk = key => typeof key==='string' && key.startsWith('w:');
const wkById = id => state.workouts.find(w=>w.id===id);
const activeWk = () => state.active && wkById(state.active) || null;
const wkKey = w => 'w:'+w.id;
const wkName = w => w.key && planById(w.key) ? planById(w.key).name : w.key && DAYS.includes(w.key) ? `Rutina del ${w.key.toLowerCase()}` : w.name || 'Entreno libre';
function startWorkout(key){
  const ids = key ? [...(listOf(key)||[])] : [];
  const w = {id:'w'+Date.now(), d:isoDate(), start:Date.now(), key:key||null, name:key ? (planById(key)||{}).name || key : 'Entreno libre',
    ids, orig:[...ids], done:{}, from:{}};
  for(const id of ids) if(state.links[linkKey(key,id)]) state.links[linkKey(wkKey(w),id)] = true;
  state.workouts.push(w); state.active = w.id;
  pruneWorkouts(); save();
  return w;
}
function pruneWorkouts(){
  const keep = state.workouts.slice(-150), ids = new Set(keep.map(w=>'w:'+w.id));
  state.workouts = keep;
  for(const k of Object.keys(state.links)) if(k.startsWith('w:') && !ids.has(k.split('|')[0])) delete state.links[k];
}
/* hecho = marcado o con al menos una serie anotada ese día */
const wkDone = (w, id) => !!w.done[id] || !!sessions(id).find(x=>x.d===w.d);
/* diferencias entre el entreno y la plantilla de la rutina */
function wkChanges(w){
  const tpl = w.key ? listOf(w.key) : null; if(!tpl) return null;
  const origOf = id => w.from[id] || id;
  const swapped = w.ids.filter(id=>w.from[id] && tpl.includes(w.from[id])).map(id=>({from:w.from[id], to:id}));
  const added = w.ids.filter(id=>!tpl.includes(origOf(id)));
  const removed = tpl.filter(id=>!w.ids.some(x=>origOf(x)===id));
  const kept = w.ids.map(origOf).filter(id=>tpl.includes(id)), tplKept = tpl.filter(id=>kept.includes(id));
  const reordered = kept.some((id,i)=>id!==tplKept[i]);
  const lw = w.ids.filter(id=>state.links[linkKey(wkKey(w),id)]).map(origOf).sort().join(',');
  const lt = tpl.filter(id=>state.links[linkKey(w.key,id)]).sort().join(',');
  const linked = lw!==lt;
  const any = swapped.length || added.length || removed.length || reordered || linked;
  return any ? {swapped, added, removed, reordered, linked} : null;
}
function applyToRoutine(w){
  const tpl = listOf(w.key); if(!tpl) return;
  for(const k of Object.keys(state.links)) if(k.startsWith(w.key+'|')) delete state.links[k];
  tpl.splice(0, tpl.length, ...w.ids);
  for(const id of w.ids) if(state.links[linkKey(wkKey(w),id)]) state.links[linkKey(w.key,id)] = true;
}
function finishWorkout(w){
  w.end = Date.now();
  if(w.key && planById(w.key)) finishPlan(w.key, w.d);
  state.active = null; save();
}
const fmtDur = ms => { const m = Math.max(1, Math.round(ms/60000)); return m>=60 ? `${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')} min` : `${m} min`; };
const fmtTime = t => { const x = new Date(t); return `${x.getHours()}:${String(x.getMinutes()).padStart(2,'0')}`; };
let wkFinish = false, wkDiscard = false;
function nextPlan(){
  const main = state.plans.filter(p=>!p.opt);
  if(!main.length) return state.plans[0] || null;
  const last = [...state.planLog].reverse().find(x=>main.some(p=>p.id===x.id));
  return last ? main[(main.findIndex(p=>p.id===last.id)+1) % main.length] : main[0];
}
function finishPlan(id, d = isoDate()){
  if(!state.planLog.some(x=>x.id===id && x.d===d)) state.planLog.push({id, d});
  state.planLog = state.planLog.sort((a,b)=>a.d.localeCompare(b.d)).slice(-100);
  save();
}
let planOpen = null, planEdit = null, planDel = null, planReview = null, planWeek = false;

/* Revisión de sesiones (reglas en coach.js) */
const coachCtx = () => ({byId, level:state.profile.level, isSpecial:id=>!!KIND[id], specialRank:id=>KIND[id].kind==='elongacion' ? 9 : 0,
  canDo:e=>!state.profile.equip.length || state.profile.equip.includes(e.q)});
function suggRow(planId, id, note){
  const e = byId[id]; if(!e) return '';
  return `<div class="srow"><img class="th sm" data-th="${id}" data-open="${id}" alt="">
    <button class="info" data-open="${id}"><b>${esc(dn(e))}</b><span class="muted small">${esc(note || tr(EQUIP,e.q))}</span></button>
    <button class="btn sm" data-pladdex="${esc(planId)}|${id}" aria-label="Agregar ${esc(dn(e))}">＋</button></div>`;
}
function reviewHTML(p){
  const r = Coach.review(p, coachCtx());
  if(r.focus==='libre') return `<div class="rev"><p class="small muted" style="margin:0">Esta sesión es libre, así que no tiene patrones fijos. Para revisarla, elige su tipo en <b>Editar</b>. Para ver qué te falta en general, abre <b>Tu semana</b>, arriba.</p>${orderHTML(p, r)}</div>`;
  const similar = r.similar.map(s=>`<li><b>${esc(dn(s.a))}</b> y <b>${esc(dn(s.b))}</b> hacen casi lo mismo (${esc(s.name)}). Puedes dejar uno y usar ese tiempo en algo distinto.</li>`).join('');
  return `<div class="rev">
    <p class="small" style="margin:0"><b>${r.done} de ${r.need}</b> patrones clave de ${esc(r.focusName)}${r.done===r.need?': sesión completa.':'.'}</p>
    ${r.covered.length?`<h5>Ya cubres</h5><ul class="cov">${r.covered.map(c=>`<li><b>${esc(c.slot.name)}:</b> ${esc(c.ex.map(dn).join(', '))}</li>`).join('')}</ul>`:''}
    ${r.missing.length?`<h5>Te falta</h5>${r.missing.map(m=>`<div class="gap"><b>${esc(m.slot.name)}</b><p class="small muted">${esc(m.slot.why)}</p>
      ${m.sugg.length?m.sugg.map(id=>suggRow(p.id,id)).join(''):'<p class="small muted">No hay sugerencias con tu equipamiento. Revísalo en Perfil.</p>'}</div>`).join('')}
      ${r.missing.some(m=>m.sugg.length)?`<button class="btn sm pri" data-plfill="${esc(p.id)}" style="margin-top:8px">Agregar el primero de cada uno</button>`:''}`:''}
    ${similar?`<h5>Muy parecidos</h5><ul class="cov">${similar}</ul>`:''}
    ${orderHTML(p, r)}
    ${r.total>8?`<h5>Sesión larga</h5><p class="small muted">Tiene ${r.total} ejercicios. Con 5 a 8 suele bastar para entrenar con buena intensidad.</p>`:''}
    ${r.optional.length?`<h5>Para sumar (opcional)</h5>${r.optional.map(m=>`<div class="gap"><b>${esc(m.slot.name)}</b><p class="small muted">${esc(m.slot.why)}</p>${m.sugg.slice(0,1).map(id=>suggRow(p.id,id)).join('')}</div>`).join('')}`:''}
  </div>`;
}
const orderHTML = (p, r) => r.needsOrder ? `<h5>Orden</h5><p class="small muted">Conviene hacer primero los ejercicios grandes, cuando estás con más energía, y al final los de músculos pequeños.</p><button class="btn sm" data-plsort="${esc(p.id)}">Ordenar la sesión</button>` : '';
function weekHTML(){
  if(!state.plans.some(p=>p.ids.length)) return '';
  const w = Coach.weekly(state.plans.filter(p=>p.kind!=='act'), coachCtx()), miss = w.filter(g=>!g.n);
  return `<div class="day">
    <button class="ph" data-plweek aria-expanded="${planWeek}">
      <span class="when">Tu semana</span><b>${w.length-miss.length} de ${w.length} grupos musculares</b>
      <span class="muted small">${miss.length?`Falta: ${esc(miss.map(g=>g.name).join(', '))}`:'Tus sesiones cubren todo el cuerpo.'}</span>
    </button>
    ${planWeek?`<div class="rev"><ul class="wk">${w.map(g=>`<li><span>${g.n?'✓':'✕'} ${esc(g.name)}</span><span class="muted">${g.n?`${g.n} ${g.n===1?'ejercicio':'ejercicios'}`:'Sin ejercicios'}</span></li>`).join('')}</ul>

/* ---------- Tipos de rutina ----------
   Cada tipo crea sus sesiones (nombre y tipo para el revisor) y, si se pide, las llena con ejercicios
   conocidos según nivel y equipo (Coach.build). Las sesiones anteriores quedan guardadas para recuperarlas. */
const SPLITS = {
  ppl:{name:'Empuje / Tirón / Pierna', desc:'3 sesiones: pecho, hombros y tríceps · espalda y bíceps · pierna.', days:[['Empuje','empuje'],['Tirón','tiron'],['Pierna','pierna']]},
  full:{name:'Full body', desc:'Todo el cuerpo en cada sesión. Ideal para empezar o si vas 2 o 3 días por semana.', days:[['Full body A','completo'],['Full body B','completo'],['Full body C','completo']]},
  tp:{name:'Torso / Pierna', desc:'4 sesiones: torso y pierna alternados, dos veces cada uno.', days:[['Torso A','torso'],['Pierna A','pierna'],['Torso B','torso'],['Pierna B','pierna']]},
  musculo:{name:'Por músculo', desc:'Un grupo por día: pecho, espalda, pierna, hombros y brazos.', days:[['Pecho','pecho'],['Espalda','espalda'],['Pierna','pierna'],['Hombros','hombros'],['Brazos','brazos']]},
  gluteo:{name:'Glúteos y piernas', desc:'3 sesiones con énfasis en glúteos, más una de torso.', days:[['Glúteos','gluteos'],['Torso','torso'],['Pierna','pierna']]},
  cero:{name:'Desde cero', desc:'Una sesión vacía para armarla a tu manera.', days:[['Sesión 1','libre']]}
};
const splitName = () => (SPLITS[state.profile.split] || {name:'Personalizada'}).name;
const isNewUser = () => !state.profile.split && !state.plans.some(p=>p.ids.length) && !state.planLog.length && !DAYS.some(d=>state.routine[d].length);
let splitOpen = null;
function applySplit(key, fill){
  const sp = SPLITS[key], ctx = coachCtx(), n = {principiante:5, intermedio:6, avanzado:7}[state.profile.level] || 6;
  const old = state.plans, t = Date.now(), count = {};
  if(old.some(p=>p.ids.length || state.planLog.some(x=>x.id===p.id))){
    state.plansPrev = {plans:old, split:state.profile.split || null};
    for(const p of old) if(!state.archived.some(a=>a.id===p.id)) state.archived.push({id:p.id, name:p.name, ...(p.kind?{kind:p.kind}:{})});
  }
  state.plans = sp.days.map(([name, focus], i)=>{
    const v = count[focus] = (count[focus] ?? -1) + 1;
    return {id:`p${t}${i}`, name, focus, ids: fill ? Coach.build(focus, ctx, v, n) : []};
  });
  /* los días de actividad (bici, trote…) se mantienen */
  state.plans.push(...old.filter(p=>p.kind==='act'));
  state.profile.split = key; state.routineMode = 'sesiones';
  save();
}

/* Semana de deporte: gimnasio y actividades, lunes a domingo */
function weekStrip(){
  const now = new Date(), mon = new Date(now);
  mon.setDate(now.getDate() - (now.getDay()+6)%7);
  const days = [...Array(7)].map((_,i)=>{ const t = new Date(mon); t.setDate(mon.getDate()+i); return isoDate(t); });
  const today = isoDate();
  const info = days.map(d=>({d, l:dayLog(d)})), n = info.filter(x=>x.l.any).length;
  return `<div class="wkstrip">
    <b>Esta semana: ${n} ${n===1?'día':'días'} de deporte</b>
    <div class="wkdays">${info.map((x,i)=>`<span class="wd ${kindClass(x.l)} ${x.d===today?'today':''}" aria-label="${DAYS[i]}${x.l.any?': '+esc(dayText(x.l)):''}">${'LMMJVSD'[i]}</span>`).join('')}</div>
    ${n?`${legendHTML()}<ul class="wklist">${info.map((x,i)=>x.l.any?`<li><b>${DAYS[i]}:</b> ${doneHTML(x.l)}</li>`:'').join('')}</ul>`:''}
    <button class="btn sm" data-actnew>＋ Registrar actividad</button>
  </div>`;
}

const kindClass = l => l.gym && l.acts.length ? 'both' : l.gym ? 'gym' : l.acts.length ? 'act' : '';
const gymLabel = l => l.plans.length ? l.plans.map(p=>p.name).join(' + ') : 'Gimnasio';
const dayText = l => [...(l.gym?[gymLabel(l)]:[]), ...l.acts.map(a=>actName(a)+(actText(a)?` ${actText(a)}`:''))].join(', ');
const doneHTML = l => [...(l.gym?[`<span class="pill gym">${esc(gymLabel(l))}</span>`]:[]),

const legendHTML = () => `<div class="legend"><span><i class="sw gym"></i>Gimnasio</span><span><i class="sw act"></i>Actividad</span></div>`;
function todayDoneHTML(){
  const l = dayLog(isoDate());
  if(!l.any) return '';
  return `<div class="didit"><span class="when">Hoy hiciste</span><div>${doneHTML(l)}</div></div>`;

/* Fecha de este nombre de día dentro de la semana actual (lunes a domingo) */
function dateThisWeek(dayName){
  const now = new Date(), t = new Date(now);
  t.setDate(now.getDate() - (now.getDay()+6)%7 + DAYS.indexOf(dayName));
  return isoDate(t);
}

/* ---------- Registro de entrenos ----------
   state.log[idEjercicio] = [{d:'AAAA-MM-DD', s:[{w:kg, r:reps} | {m:minutos}]}], ordenado por fecha */
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const isoDate = (t = new Date()) => `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
const fmtDate = d => { const [, m, day] = d.split('-'); return `${+day} ${MONTHS[+m-1]}`; };
const fmtNum = n => String(Math.round(n*100)/100).replace('.', ',');
const logType = e => KIND[e.i] ? null : (e.c==='cardio' ? 'time' : 'weight');
const validSet = s => s.m>0 || s.w>0 || s.r>0;
const entryFor = (id, d) => (state.log[id]||[]).find(x => x.d===d);
const sessions = id => (state.log[id]||[]).map(x => ({d:x.d, s:x.s.filter(validSet), ...(x.n ? {n:x.n} : {})})).filter(x => x.s.length);
const lastBefore = (id, d) => sessions(id).filter(x => x.d<d).pop();
/* Peso: cada serie guarda el número tal como se anotó y su unidad (u:'lb'; sin u = kg) */
const LB = 0.45359237;
const toKg = s => (s.w||0) * (s.u==='lb' ? LB : 1);
const unitOf = id => (state.units && state.units[id]) || state.profile.unit || 'kg';
const inUnit = (s, unit) => s.w>0 ? ((s.u||'kg')===unit ? s.w : Math.round((unit==='lb' ? toKg(s)/LB : toKg(s))*10)/10) : 0;
/* números escritos con coma o punto ("42,5") */
const parseNum = v => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) && n>=0 ? n : null; };
/* Tipos de serie: s.t = 'c' calentamiento | 'd' drop set | 'f' al fallo | 'rp' rest-pause (sin t = normal).
   Drop set y rest-pause guardan sus tramos extra en s.dr: [{w, r, u?}] (drop) o [{r}] (rest-pause, mismo peso). */
const SET_TYPES = {
  n:{tag:'', name:'Normal', help:''},
  c:{tag:'C', name:'Calentamiento', help:'Serie liviana antes de las efectivas. No cuenta para tu mejor marca ni para el gráfico.'},
  d:{tag:'D', name:'Drop set', help:'Al terminar, bajas el peso y sigues sin descanso. Anota cada bajada.'},
  f:{tag:'F', name:'Al fallo', help:'Hasta que no puedes hacer otra repetición con buena técnica.'},
  rp:{tag:'RP', name:'Rest-pause', help:'Llegas al fallo, pausas 10–15 s y sacas unas repeticiones más con el mismo peso.'}
};
const isWork = s => s.t!=='c';
const workSets = ss => { const w = ss.filter(isWork); return w.length ? w : ss; };
const okDrop = x => x.w>0 || x.r>0;
const dropText = s => !s.dr || !s.dr.some(okDrop) ? ''
  : s.t==='rp' ? ` + ${s.dr.filter(x=>x.r>0).map(x=>x.r).join(' + ')}`
  : ` → ${s.dr.filter(okDrop).map(x=>x.w>0 ? `${fmtNum(x.w)}${x.r>0?` × ${x.r}`:''}` : `${x.r} reps`).join(' → ')}`;
const typeText = s => s.t==='c' ? ' (calent.)' : s.t==='f' ? ' (al fallo)' : s.t==='rp' ? ' (rest-pause)' : s.t==='d' && !(s.dr||[]).some(okDrop) ? ' (drop)' : '';
const setText = s => (s.m>0 ? `${fmtNum(s.m)} min` : s.w>0 ? `${fmtNum(s.w)} ${s.u||'kg'}${s.r>0?` × ${s.r}`:''}` : `${s.r} reps`) + dropText(s) + typeText(s);
/* kilos movidos en una serie, con sus tramos */
const setVolume = s => toKg(s)*(s.r||0) + (s.dr||[]).reduce((a,x)=>a + (s.t==='rp' ? toKg(s) : toKg({w:x.w, u:x.u||s.u}))*(x.r||0), 0);
const sessionText = x => x.s.map(setText).join(' · ');
const bestSet = x => workSets(x.s).reduce((a,b) => ((b.m||0)+toKg(b)*1000+(b.r||0)/1000 > (a.m||0)+toKg(a)*1000+(a.r||0)/1000 ? b : a));
/* tramo nuevo: en drop set, ~20 % menos peso (redondeado a 2,5 kg o 5 lb); en rest-pause, solo reps */
function newDrop(from, t){
  if(t==='rp') return {r:null};
  const u = from.u==='lb' ? 'lb' : 'kg', step = u==='lb' ? 5 : 2.5;
  const w = from.w>0 ? Math.max(step, Math.round(from.w*0.8/step)*step) : null;
  return {w, r:null, ...(u==='lb'?{u}:{})};
}
function metric(id){
  const ss = sessions(id), e = byId[id], u = unitOf(id);
  if(logType(e)==='time') return {title:'Minutos por sesión', unit:'min', pts:ss.map(x=>({d:x.d, v:x.s.reduce((a,s)=>a+(s.m||0),0)}))};
  /* las series de calentamiento no cuentan */
  if(ss.some(x=>x.s.some(s=>s.w>0))) return {title:'Mejor peso por sesión', unit:u, pts:ss.filter(x=>workSets(x.s).some(s=>s.w>0)).map(x=>({d:x.d, v:Math.max(...workSets(x.s).map(s=>inUnit(s,u)))}))};
  return {title:'Mejores repeticiones por sesión', unit:'reps', pts:ss.map(x=>({d:x.d, v:Math.max(...workSets(x.s).map(s=>s.r||0))}))};
}
function pruneLog(id){
  if(!state.log[id]) return;
  state.log[id] = sessions(id);
  for(const x of state.log[id]) for(const s of x.s) if(s.dr){ s.dr = s.dr.filter(okDrop); if(!s.dr.length) delete s.dr; }
  if(!state.log[id].length) delete state.log[id];
  save();
}
function addSet(id, blank){
  const list = state.log[id] || (state.log[id] = []);
  let en = entryFor(id, logDate);
  if(!en){ en = {d:logDate, s:[]}; list.push(en); list.sort((a,b)=>a.d<b.d?-1:1); }
  const prev = blank ? null : en.s[en.s.length-1];
  const u = unitOf(id);
  if(logType(byId[id])==='time'){ en.s.push({m:prev?prev.m:null}); save(); return; }
  /* la serie nueva copia la anterior; en pirámide sube (o baja) el peso y ajusta las reps */
  let w = prev&&prev.w ? inUnit(prev,u) : null, r = prev ? prev.r : null;
  const step = u==='lb' ? 5 : 2.5;
  if(prev && nextMode!=='igual' && w>0){
    w = nextMode==='sube' ? w + step : Math.max(0, w - step);
    if(r>0) r = nextMode==='sube' ? Math.max(1, r - 2) : r + 2;
  }
  en.s.push({w, r, ...(prev&&prev.t==='c'?{t:'c'}:{}), ...(u==='lb'?{u}:{})});
  save();
}
/* ---------- Historial: todo lo hecho en un período ---------- */
const WEEKDAY = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const addDays = (d, n) => { const t = new Date(d+'T12:00'); t.setDate(t.getDate()+n); return isoDate(t); };
function dayLog(d){
  const ex = Object.keys(state.log).map(id=>({id, x:sessions(id).find(x=>x.d===d)})).filter(o=>o.x && byId[o.id]);
  /* nombres: sesiones terminadas ese día y entrenos que no vienen de una sesión (por días o libres) */
  const wks = state.workouts.filter(w=>w.d===d && w.end);
  const plans = [...state.planLog.filter(x=>x.d===d).map(x=>planInfo(x.id)).filter(p=>p && p.kind!=='act'),
    ...wks.filter(w=>!(w.key && planInfo(w.key))).map(w=>({id:w.id, name:wkName(w)}))];
  const acts = state.acts.filter(a=>a.d===d);
  return {ex, plans, acts, wks, gym:ex.length>0 || plans.length>0, any:ex.length>0 || plans.length>0 || acts.length>0};
}
const dayTitle = l => gymLabel(l);
const dayVolume = d => Object.keys(state.log).reduce((a,id)=>{ const x = sessions(id).find(x=>x.d===d); return a + (x ? x.s.reduce((b,s)=>b+setVolume(s),0) : 0); }, 0);
const fmtKg = kg => kg>=10000 ? `${fmtNum(Math.round(kg/100)/10)} t` : `${fmtNum(Math.round(kg))} kg`;
function periodStats(from, to){
  const days = new Set(), gymDays = new Set();
  let sets = 0, kg = 0, min = 0, km = 0;
  for(const id of Object.keys(state.log)) for(const x of sessions(id)) if(x.d>=from && x.d<=to){
    days.add(x.d); gymDays.add(x.d); sets += x.s.length;
    for(const s of x.s){ kg += setVolume(s); min += s.m||0; }
  }
  for(const x of state.planLog) if(x.d>=from && x.d<=to){ const p = planInfo(x.id); if(p && p.kind!=='act'){ days.add(x.d); gymDays.add(x.d); } }
  for(const w of state.workouts) if(w.end && w.d>=from && w.d<=to){ days.add(w.d); gymDays.add(w.d); }
  for(const a of state.acts) if(a.d>=from && a.d<=to){ days.add(a.d); min += a.min||0; km += a.km||0; }
  return {days:days.size, gym:gymDays.size, sets, kg, min, km};
}

/* ---------- Ficha de un día de entreno ----------
   Todas las series de cada ejercicio, lo que quedó sin hacer, la comparación con la vez anterior
   (por ejercicio y con la misma sesión) y la opción de corregir o agregar algo a ese día. */
function exCompare(id, x, d){
  const prev = lastBefore(id, d); if(!prev) return {txt:'Primera vez', c:'new'};
  const a = bestSet(x), b = bestSet(prev), u = unitOf(id), when = fmtDate(prev.d);
  if(a.m>0 || b.m>0){ const df = (a.m||0)-(b.m||0); return df ? {txt:`${df>0?'↑ +':'↓ −'}${fmtNum(Math.abs(df))} min vs ${when}`, c:df>0?'up':'down'} : {txt:`= igual que el ${when}`, c:''}; }
  const dw = Math.round((inUnit(a,u)-inUnit(b,u))*100)/100;
  if(dw) return {txt:`${dw>0?'↑ +':'↓ −'}${fmtNum(Math.abs(dw))} ${u} vs ${when}`, c:dw>0?'up':'down'};
  const dr = (a.r||0)-(b.r||0);
  return dr ? {txt:`${dr>0?'↑ +':'↓ −'}${Math.abs(dr)} reps vs ${when}`, c:dr>0?'up':'down'} : {txt:`= igual que el ${when}`, c:''};
}

/* Gráfico de línea: una serie, eje de fechas real, toque o cursor para leer cada punto */
function niceTicks(min, max){
  if(min===max){ min -= 1; max += 1; }
  const raw = (max-min)/3, pow = 10**Math.floor(Math.log10(raw));
  const step = [1,2,2.5,5,10].map(x=>x*pow).find(x=>x>=raw);
  const lo = Math.max(0, Math.floor(min/step)*step), hi = Math.ceil(max/step)*step, out = [];
  for(let v=lo; v<=hi+step/1000; v+=step) out.push(v);
  return out;
}
function lineChart(el, m){
  const pts = m.pts, W = Math.max(260, el.clientWidth||320), H = 170, L = 36, R = 14, T = 26, B = 24;
  const ticks = niceTicks(Math.min(...pts.map(p=>p.v)), Math.max(...pts.map(p=>p.v)));
  const lo = ticks[0], hi = ticks[ticks.length-1];
  const t0 = Date.parse(pts[0].d), t1 = Date.parse(pts[pts.length-1].d);
  const X = p => t1===t0 ? (L+W-R)/2 : L + (Date.parse(p.d)-t0)/(t1-t0)*(W-L-R);
  const Y = v => H-B - (v-lo)/(hi-lo)*(H-T-B);
  const end = pts[pts.length-1];
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.title)}: de ${fmtNum(pts[0].v)} a ${fmtNum(end.v)} ${m.unit}">
    ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmtNum(v)}</text>`).join('')}
    <text class="ax" x="${L}" y="${H-6}">${fmtDate(pts[0].d)}</text>
    ${pts.length>1?`<text class="ax" x="${W-R}" y="${H-6}" text-anchor="end">${fmtDate(end.d)}</text>`:''}
    <line class="xh" y1="${T}" y2="${H-B}" visibility="hidden"/>
    ${pts.length>1?`<polyline class="ln" points="${pts.map(p=>`${X(p)},${Y(p.v)}`).join(' ')}"/>`:''}
    <circle class="dot" cx="${X(end)}" cy="${Y(end.v)}" r="5"/>
    <circle class="dot cur" r="5" visibility="hidden"/>
    <text class="val" x="${Math.min(X(end), W-R)}" y="${Y(end.v)-11}" text-anchor="${pts.length>1?'end':'middle'}">${fmtNum(end.v)} ${m.unit}</text>
  </svg><div class="tip" hidden></div>`;
  const svg = el.firstElementChild, tip = el.querySelector('.tip'), xh = el.querySelector('.xh'), cur = el.querySelector('.cur');
  const show = ev => {
    const x = ev.clientX - svg.getBoundingClientRect().left;
    const p = pts.reduce((a,b) => Math.abs(X(b)-x) < Math.abs(X(a)-x) ? b : a);
    xh.setAttribute('x1', X(p)); xh.setAttribute('x2', X(p)); xh.setAttribute('visibility', 'visible');
    cur.setAttribute('cx', X(p)); cur.setAttribute('cy', Y(p.v)); cur.setAttribute('visibility', 'visible');
    tip.textContent = `${fmtDate(p.d)} · ${fmtNum(p.v)} ${m.unit}`; tip.hidden = false;
    tip.style.left = Math.max(0, Math.min(X(p) - tip.offsetWidth/2, W - tip.offsetWidth)) + 'px';
  };
  const hide = () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); cur.setAttribute('visibility', 'hidden'); };
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerleave', hide);
}
function sparkline(pts){
  if(pts.length<2) return '';
  const W = 72, H = 30, P = 5, vs = pts.map(p=>p.v), lo = Math.min(...vs), hi = Math.max(...vs);
  const t0 = Date.parse(pts[0].d), t1 = Date.parse(pts[pts.length-1].d);
  const X = p => P + (Date.parse(p.d)-t0)/((t1-t0)||1)*(W-2*P);
  const Y = v => hi===lo ? H/2 : H-P - (v-lo)/(hi-lo)*(H-2*P);
  const end = pts[pts.length-1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline class="ln" points="${pts.map(p=>`${X(p)},${Y(p.v)}`).join(' ')}"/><circle class="dot" cx="${X(end)}" cy="${Y(end.v)}" r="4"/></svg>`;
}

/* Con la ficha abierta, la página de fondo queda fija. En iPhone, overflow:hidden no basta: la página
   igual se mueve, la barra de Safari cambia de alto y el menú de abajo queda dibujado a media pantalla.
   Fijar el body (guardando el scroll) y ocultar el menú evita eso. */
let lockedY = null;
function lockPage(){
  if(lockedY!==null) return;
  lockedY = scrollY;
  Object.assign(document.body.style, {position:'fixed', top:`-${lockedY}px`, left:'0', right:'0', overflow:'hidden'});
  document.body.classList.add('sheet-open');
}
function unlockPage(){
  if(lockedY===null) return;
  Object.assign(document.body.style, {position:'', top:'', left:'', right:'', overflow:''});
  document.body.classList.remove('sheet-open');
  scrollTo(0, lockedY); lockedY = null;
}

/* ---------- Temporizador de descanso ----------
   Dura lo que indica tu objetivo (promedio del rango: 60–90 s -> 75 s). Usa la hora de término,
   así sigue bien aunque la pantalla se apague; al terminar suena y vibra (donde el teléfono lo permite). */
function restSeconds(e){
  const r = String(prescription(e).rest), n = (r.match(/\d+/g)||[]).map(Number);
  if(!n.length) return 90;
  const avg = n.reduce((a,b)=>a+b,0)/n.length * (/min/.test(r) ? 60 : 1);
  return Math.max(15, Math.round(avg/5)*5);
}
const fmtRest = s => s>=60 ? `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}` : `${s} s`;
let restEnd = 0, restTimer = null, audio = null;
function restStart(sec){
  try{ audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); }catch(_){}
  restEnd = Date.now() + sec*1000;
  clearInterval(restTimer); restTimer = setInterval(restTick, 250); restTick();
}
function restAdd(sec){ if(!restEnd) return; restEnd = Math.max(Date.now()+5000, restEnd + sec*1000); restTick(); }
function restStop(){ clearInterval(restTimer); restEnd = 0; const el = $('#rest'); el.hidden = true; document.body.classList.remove('resting'); }
function restTick(){
  const el = $('#rest'), left = Math.ceil((restEnd - Date.now())/1000);
  document.body.classList.add('resting'); el.hidden = false;
  if(left > 0){
    el.className = 'rest';
    el.innerHTML = `<span class="rt">Descanso <b>${fmtRest(left)}</b></span>
      <button data-rest="-15" aria-label="Quitar 15 segundos">−15</button><button data-rest="15" aria-label="Sumar 15 segundos">+15</button><button data-rest="stop" aria-label="Cerrar descanso">✕</button>`;
    return;
  }
  clearInterval(restTimer); restEnd = 0;
  el.className = 'rest done';
  el.innerHTML = `<span class="rt"><b>¡A la siguiente serie!</b></span><button data-rest="stop" aria-label="Cerrar">✕</button>`;
  beep(); try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(_){}
  setTimeout(()=>{ if(!restEnd) restStop(); }, 5000);
}
function beep(){
  if(!audio) return;
  try{
    [0, .25, .5].forEach(t=>{
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(.0001, audio.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.4, audio.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime+t+.18);
      o.start(audio.currentTime+t); o.stop(audio.currentTime+t+.2);
    });
  }catch(_){}
}

    const en = entryFor(openId, logDate);
    const conv = s => { if(s.w>0 && (s.u||'kg')!==u){ s.w = inUnit(s, u); if(u==='lb') s.u = 'lb'; else delete s.u; } };
    if(en) for(const s of en.s){ if(s.t==='d') (s.dr||[]).forEach(conv); conv(s); }

  if('punit' in d){ state.profile.unit = d.punit; save(); render(); return; }

  if('target' in d){ view.target = d.target; view.limit = 40; render(); return; }

    else { const w = activeWk(); state.workouts = state.workouts.filter(x=>x!==w); state.active = null; wkDiscard = false; picker = null; save(); view = {tab:'home', zone:null, target:'', equip:'', q:'', limit:40}; toast('Entreno descartado'); }

  }

    planOpen = null; save(); render(); return;
  }
  if('up' in d){ const [day,id] = d.up.split('|'); const l = listOf(day), i = l.indexOf(id); if(i>0){ [l[i-1],l[i]] = [l[i],l[i-1]]; save(); render(); } return; }
  if('clear' in d){

  if('eq' in d){ const p = state.profile; p.equip = p.equip.includes(d.eq) ? p.equip.filter(x=>x!==d.eq) : [...p.equip, d.eq]; save(); render(); return; }
  if('actnew' in d){
    const p = d.actnew ? planById(d.actnew) : null;

  if('actcancel' in d){ actForm = null; actErr = ''; render(); return; }
  if('actall' in d){ actAll = !actAll; render(); return; }

  if('histmore' in d){ histMore = !histMore; render(); return; }
  if('histday' in d){ openDay(d.histday); return; }
  if('actsave' in d){

    const rec = {id:f.id || 'a'+Date.now(), d:f.d && f.d<=isoDate() ? f.d : isoDate(), type:f.type,

      const plan = old && actPlanFor(old.type, actForm.plan);
      if(plan && !state.acts.some(a=>a.d===old.d && actPlanFor(a.type)===plan))
        state.planLog = state.planLog.filter(x=>!(x.id===plan.id && x.d===old.d));

  if('sub' in d){ view.sub = d.sub; if(d.sub!=='progreso'){ state.routineMode = d.sub; save(); } render(); return; }

  if('log' in d){

  if('adddrop' in d){

  }
  if('deldrop' in d){
    const [i, j] = d.deldrop.split('|').map(Number), en = entryFor(openId, logDate), s = en && en.s[i];

  }
  if('nextmode' in d){ nextMode = d.nextmode; renderLog(openId); return; }
  if('loghist' in d){ openDetail(d.loghist); const h = $('#logHist'); if(h) h.scrollIntoView({block:'start'}); return; }
  if('addset' in d){
    /* si ya había una serie anotada hoy, terminarla = empezar el descanso */
    const before = entryFor(openId, logDate), weight = logType(byId[openId])==='weight';

    const g = logCtx ? groupOf(logCtx.key, logCtx.orig) : [], midBlock = g.length>1 && g[g.length-1]!==logCtx.orig;
    if(weight && before && before.s.some(validSet) && logDate===isoDate() && !midBlock) restStart(restSeconds(byId[openId]));

  if('delset' in d){ const en = entryFor(openId, logDate); if(en){ en.s.splice(+d.delset, 1); stypeOpen = null; save(); renderLog(openId); } return; }
  if('editsess' in d){ pruneLog(openId); logDate = d.editsess; logDel = null; renderLog(openId); $('#logBox').scrollIntoView({block:'start'}); return; }
  if('delsess' in d){
    if(d.delsess==='no') logDel = null;
    else if(d.delsess==='yes'){
      state.log[openId] = (state.log[openId]||[]).filter(x=>x.d!==logDel);

    } else logDel = d.delsess;
    renderLogHist(openId); return;
  }
  if('logall' in d){ logAll = !logAll; renderLogHist(openId); return; }
  if('media' in d){
    if(d.media==='ask'){ mediaConfirm = true; render(); return; }
    mediaConfirm = false;
    if(d.media==='yes' && 'caches' in window){
      caches.delete(MEDIA_CACHE).then(()=>{ toast('Animaciones borradas'); render(); });
    } else render();
    return;
  }
  if('backup' in d){
    const msg = $('#backupMsg');
    if(d.backup==='copy'){
      const code = backupCode();
      navigator.clipboard.writeText(code).then(()=>toast('Código copiado'), ()=>{ const r=$('#restore'); r.value=code; r.select(); msg.textContent='Copia el código seleccionado.'; });
    } else {
      try{ restoreCode($('#restore').value); toast('Datos restaurados'); render(); }
      catch(_){ msg.textContent = 'Ese código no es válido. Cópialo completo desde el otro dispositivo.'; }
    }
    return;
  }
  if('preset' in d){ state.profile.equip = [...PRESETS[d.preset]]; state.profile.onlyMine = d.preset!=='none'; save(); render(); toast('Equipamiento actualizado'); return; }
});
document.addEventListener('keydown', ev=>{
  if(ev.key==='Escape' && openId) closeDetail();
  if((ev.key==='Enter'||ev.key===' ') && ev.target.matches('div[data-open],div[data-loghist]')){ ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('change', ev=>{
  const t = ev.target;
  if(t.matches('[data-equip]')){ view.equip = t.value; view.limit = 40; render(); }
  else if(t.matches('[data-plfocus]')){
    const p = planById(t.dataset.plfocus);
    if(p){
      if(t.value==='act'){ p.kind = 'act'; p.actType = p.actType || 'bici'; delete p.focus; }
      else { delete p.kind; p.focus = t.value; }
      save(); render();
    }
  }
  else if(t.matches('[data-plact]')){ const p = planById(t.dataset.plact); if(p){ p.actType = t.value; save(); render(); } }
  else if(t.matches('[data-swapforever]')){ swapForever = t.checked; }
  else if(t.matches('[data-splitfill]')){ if(splitOpen) splitOpen.fill = t.checked; }
  else if(t.matches('[data-plopt]')){ const p = planById(t.dataset.plopt); if(p){ p.opt = t.checked; save(); render(); } }
  else if(t.matches('[data-logdate]')){
    pruneLog(openId); logDate = (t.value && t.value<=isoDate()) ? t.value : isoDate(); logDel = null; renderLog(openId);
  }
  else if(t.matches('[data-onlymine]')){ state.profile.onlyMine = t.checked; save(); render(); }
  else if(t.matches('[data-wdone]')){
    /* false explícito = desmarcado aunque tenga series anotadas */
    const [wid, id] = t.dataset.wdone.split('|'), w = wkById(wid);
    if(w){ w.done[id] = t.checked; save(); render(); }
  }
});
let qTimer, nameTimer;
document.addEventListener('input', ev=>{
  const t = ev.target;
  if(t.matches('[data-pq]')){
    /* solo se redibujan los resultados, así el teclado no se cierra */
    if(!picker) return; picker.q = t.value; clearTimeout(qTimer);
    qTimer = setTimeout(()=>{ const r = $('#pickRes'); if(r){ r.innerHTML = pickResHTML(); hydrateThumbs(r); } }, 150);
    return;
  }
  if(t.matches('[data-q]')){
    clearTimeout(qTimer);
    qTimer = setTimeout(()=>{ view.q = t.value; view.limit = 40; const pos = t.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos,pos); }, 200);
  } else if(t.matches('[data-gq]')){
    view = {tab:'explore', zone:null, target:'', equip:'', q:t.value, limit:40}; render();
    const n = $('#q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length);
  } else if(t.matches('[data-plname]')){
    const p = planById(t.dataset.plname); if(p){ p.name = t.value; save(); }
  } else if(t.matches('[data-actf]') && actForm){
    const k = t.dataset.actf;
    if(k==='min' || k==='km'){ actForm[k] = parseNum(t.value); }
    else actForm[k] = t.value;
  } else if(t.matches('[data-lnote]')){
    /* la nota se guarda junto a las series de ese día; sin series, se descarta al cerrar */
    const list = state.log[openId] || (state.log[openId] = []);
    let en = entryFor(openId, logDate);
    if(!en){ en = {d:logDate, s:[]}; list.push(en); list.sort((a,b)=>a.d<b.d?-1:1); }
    const v = t.value.trim(); if(v) en.n = t.value.slice(0,300); else delete en.n;
    save(); renderLogHist(openId);
  } else if(t.matches('[data-ldw],[data-ldr]')){
    /* tramos de drop set o rest-pause */
    const [i, j] = (t.dataset.ldw ?? t.dataset.ldr).split('|').map(Number);
    const en = entryFor(openId, logDate), x = en && en.s[i] && en.s[i].dr && en.s[i].dr[j];
    if(!x) return;
    const n = parseNum(t.value);
    if('ldw' in t.dataset){ x.w = n===null ? null : Math.round(n*100)/100; if(unitOf(openId)==='lb') x.u = 'lb'; else delete x.u; }
    else x.r = n===null ? null : Math.round(n);
    save(); renderLogHist(openId);
  } else if(t.matches('[data-lw],[data-lr],[data-lm]')){
    const en = entryFor(openId, logDate), s = en && en.s[+(t.dataset.lw ?? t.dataset.lr ?? t.dataset.lm)];
    if(!s) return;
    const n = parseNum(t.value);
    if('lw' in t.dataset){
      /* el peso queda en la unidad elegida para este ejercicio */
      s.w = n===null ? null : Math.round(n*100)/100;
      if(unitOf(openId)==='lb') s.u = 'lb'; else delete s.u;
    }
    else if('lr' in t.dataset) s.r = n===null ? null : Math.round(n); else s.m = n;
    save(); renderLogHist(openId);
  } else if(t.matches('[data-pname]')){
    state.profile.name = t.value; saveLocal(); clearTimeout(nameTimer); nameTimer = setTimeout(save, 600);
  }
});

/* ---------- Arranque ---------- */
fetch('data.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(data=>{
  EX = data; byId = Object.fromEntries(EX.map(e=>[e.i, e]));
  for(const e of EX){ e.es = ES.toSpanish(e.n).es; indexForSearch(e); }
  render();
}).catch(()=>{ app.innerHTML = '<div class="empty">No se pudieron cargar los ejercicios. Recarga la página para intentarlo de nuevo.</div>'; });
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
