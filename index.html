<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Gym</title>
<meta name="description" content="Ejercicios por zona con pasos en español, consejos de técnica y tu rutina semanal.">
<meta name="theme-color" content="#eef0ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Gym">
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: app de una columna, pestañas fijas abajo; zonas como "placas" de gimnasio, ejercicios como filas escaneables. */
:root{
  --bg:#eef0ee; --surface:#ffffff; --surface2:#e4e7e4; --line:#d3d7d3;
  --ink:#16191d; --muted:#5d6670; --accent:#c8321e; --accent-ink:#ffffff; --accent-soft:#f6dcd6;
  --ok:#1f7a4d; --warn:#9a5a00;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1b1e23; --surface2:#252a30; --line:#30363e;
  --ink:#eef0f2; --muted:#9aa3ad; --accent:#ff6b4f; --accent-ink:#1a0b07; --accent-soft:#3a1f19;
  --ok:#5fd39a; --warn:#ffb85c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1b1e23; --surface2:#252a30; --line:#30363e;
  --ink:#eef0f2; --muted:#9aa3ad; --accent:#ff6b4f; --accent-ink:#1a0b07; --accent-soft:#3a1f19;
  --ok:#5fd39a; --warn:#ffb85c; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:34px;font-weight:800;line-height:1;text-transform:uppercase}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:22px;font-weight:700;text-transform:uppercase;margin:28px 0 12px}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}

/* zonas */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.zone{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:96px;justify-content:space-between;transition:border-color .12s,transform .12s}
.zone:hover{border-color:var(--accent);transform:translateY(-1px)}
.zone b{font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;line-height:1.05}
.zone .cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.zone .mus{color:var(--muted);font-size:12px;line-height:1.3}
.zones.pair{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.zone.sp{border-left:4px solid var(--accent)}
.zone .when{display:block;font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px}
.plan h4{font-size:16px;font-weight:700;text-transform:uppercase;margin-bottom:4px}
.plan ol{margin:0;padding-left:20px}
.plan li{margin:4px 0;font-size:15px}

/* chips y filtros */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;max-width:100%}
label.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}

/* lista de ejercicios */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.ex{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px 12px 14px;text-align:left;min-width:0}
.ex:hover{border-color:var(--accent)}
.ex{padding-left:8px}
.th{width:64px;height:64px;flex:none;border-radius:10px;background:var(--surface2);object-fit:cover;max-width:100%}
.th.ok{background:#fff}
.th.sm{width:48px;height:48px;cursor:pointer}
.anim{background:#fff;border-radius:14px;margin:12px auto 0;width:100%;max-width:300px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden}
.anim .muted{color:#5d6670;padding:16px;text-align:center}
.gif{width:100%;height:100%;object-fit:contain;display:block}
.ex .info{flex:1;min-width:0}
.ex .nm{font-weight:600;text-transform:capitalize;line-height:1.25;overflow-wrap:anywhere}
.ex .meta{color:var(--muted);font-size:13px;margin-top:2px}
.ex .fav{background:none;border:0;font-size:20px;color:var(--muted);padding:6px;line-height:1}
.ex .fav.on{color:var(--accent)}
.count{color:var(--muted);font-size:13px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.more{display:block;margin:16px auto;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.empty{padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--radius);border:1px dashed var(--line)}
.back{background:none;border:0;color:var(--accent);padding:0;margin-bottom:10px;font-weight:600}

/* detalle */
.sheet{position:fixed;inset:0;background:rgba(10,12,14,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .box{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .2s ease-out}
@media(min-width:780px){.sheet{align-items:center}.sheet .box{border-radius:20px;padding:22px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet .box{animation:none}.zone{transition:none}}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hd h3{font-size:28px;font-weight:700;text-transform:capitalize;line-height:1.05}
.x{background:var(--surface2);border:0;border-radius:999px;width:38px;height:38px;font-size:18px;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.a{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.rx div{background:var(--surface2);border-radius:12px;padding:10px 6px;text-align:center}
.rx b{display:block;font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.rx span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 11px;font-size:14px;font-weight:500}
.dlg{margin-top:10px;background:var(--surface2);border-radius:12px;padding:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
h4.sec{font-size:18px;font-weight:700;text-transform:uppercase;margin:22px 0 6px}
ol.steps{padding-left:0;list-style:none;counter-reset:s;margin:0}
ol.steps li{counter-increment:s;position:relative;padding:9px 0 9px 40px;border-bottom:1px solid var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:999px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:700;display:grid;place-items:center}
.tips{border-left:3px solid var(--ok);padding:4px 0 4px 14px;margin-top:16px}
.tips h4{font-size:16px;font-weight:700;text-transform:uppercase;color:var(--ok);margin-bottom:4px}
.tips.warn{border-color:var(--warn)}
.tips.warn h4{color:var(--warn)}
.tips ul{margin:0;padding-left:18px}
.tips li{margin:4px 0}

/* rutina */
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.day h4{font-size:20px;font-weight:700;text-transform:uppercase}
.ritem{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dh + .ritem{margin-top:8px}
.ritem input{width:22px;height:22px;flex:none}
.ritem .info{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.ritem .info b{display:block;text-transform:capitalize;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem.done .info b{text-decoration:line-through;color:var(--muted)}
.ib{background:none;border:0;color:var(--muted);font-size:18px;padding:6px}
.progress{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--accent)}
.day.nx{border-color:var(--accent)}
.ph{display:flex;flex-direction:column;gap:1px;width:100%;background:none;border:0;padding:0;text-align:left}
.ph .when{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.ph b{font-family:var(--f-display);font-size:22px;font-weight:700;text-transform:uppercase;line-height:1.1}
.ph + .ritem{margin-top:8px}
.btn:disabled{opacity:.45;cursor:default}
.rev{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.rev h5{font-family:var(--f-display);font-size:16px;font-weight:700;text-transform:uppercase;margin:14px 0 4px}
.rev .cov{margin:0;padding-left:18px;font-size:14px}
.rev .cov li{margin:3px 0;overflow-wrap:anywhere}
.rev .cov b{text-transform:capitalize}
.rev .wk{list-style:none;margin:0;padding:0;font-size:14px}
.rev .wk li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.gap{margin-top:8px}
.gap p{margin:1px 0 2px}
.srow{display:flex;align-items:center;gap:10px;padding:6px 0;min-width:0}
.srow .info{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;display:flex;flex-direction:column}
.srow .info b{text-transform:capitalize;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.ritem{flex-wrap:wrap}
.rlog{flex-basis:100%;display:flex;align-items:center;gap:10px;min-width:0}

/* registro y progreso */
.logbox{background:var(--surface2);border-radius:12px;padding:12px}
.logtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logbox input{min-width:0;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
.logtop input{width:auto}
.lsets{display:grid;gap:6px 8px;align-items:center;margin-top:10px}
.lsets.weight{grid-template-columns:20px minmax(0,1fr) 12px minmax(0,1fr) 32px}
.lsets.time{grid-template-columns:20px minmax(0,1fr) 32px}
.lh{font-size:12px;color:var(--muted)}
.ln-n{font-family:var(--f-display);font-weight:700;text-align:center}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;max-width:100%}
.grid{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.val{fill:var(--ink);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.xh{stroke:var(--muted);stroke-width:1}
.tip{position:absolute;top:0;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:3px 8px;border-radius:8px;white-space:nowrap;pointer-events:none}
.wkstrip{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.wkdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:10px 0 8px}
.wd{display:grid;place-items:center;aspect-ratio:1;max-width:40px;width:100%;margin:0 auto;border-radius:999px;background:var(--surface2);color:var(--muted);font-family:var(--f-display);font-weight:700}
.wd.on{background:var(--accent);color:var(--accent-ink)}
.wd.today{box-shadow:0 0 0 2px var(--ink)}
.wklist{list-style:none;margin:0 0 10px;padding:0;font-size:14px}
.wklist li{padding:3px 0;overflow-wrap:anywhere}
.rx.stats3{margin-top:6px}
.rx.stats3 span{letter-spacing:.02em;line-height:1.2;display:block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:360px}
.cal .ch{text-align:center;font-size:12px;color:var(--muted)}
.cd{aspect-ratio:1;border:0;border-radius:8px;background:var(--surface2);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding:0}
.cd.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cd.today{box-shadow:0 0 0 2px var(--ink)}
.cd:disabled{cursor:default}
.feed{display:flex;flex-direction:column;gap:8px}
.fday{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;scroll-margin-top:12px}
.fh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.fh b{font-family:var(--f-display);font-size:18px;text-transform:uppercase}
.fl{display:flex;flex-direction:column;width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;padding:7px 0;margin-top:6px;min-width:0}
.fl .fn{font-weight:600;text-transform:capitalize;overflow-wrap:anywhere}
.note{display:block;font-style:italic;color:var(--ink);margin-top:2px;overflow-wrap:anywhere}
.logbox textarea{width:100%;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;resize:vertical;margin-top:4px}
.actform{margin:4px 0 10px}
.actform input{display:block;margin-top:4px}
.actgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.actgrid label:first-child{grid-column:1/-1}
.actgrid label{min-width:0}
.lhist{margin-top:8px}
.lrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.lrow .info{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;display:flex;flex-direction:column}
.spark{flex:none;margin-right:6px}
.spark .dot{stroke:var(--surface)}

/* perfil */
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.form label.f{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.form label.f:first-child{margin-top:0}
.form input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:99px;background:var(--muted)}
.sync.on i{background:var(--ok)}

.gt{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.gt div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.gt b{display:block;font-family:var(--f-display);font-size:18px;text-transform:uppercase;margin-bottom:4px}
.gt span{color:var(--muted);font-size:14px}

/* pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto}
nav.tabs button{flex:1;background:none;border:0;padding:10px 2px 12px;color:var(--muted);font-family:var(--f-display);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-top:3px solid transparent}
nav.tabs button.on{color:var(--ink);border-top-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1}
.foot{margin-top:24px;color:var(--muted);font-size:13px}
.foot a{color:var(--accent)}
</style>
</head>
<body>

<div class="wrap" id="app"><div class="empty">Cargando ejercicios…</div></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="box" id="sheetBox"></div></div>
<nav class="tabs"><div class="in">
  <button data-tab="home" class="on">Zonas</button>
  <button data-tab="explore">Buscar</button>
  <button data-tab="routine">Rutina</button>
  <button data-tab="favs">Favoritos</button>
  <button data-tab="profile">Perfil</button>
</div></nav>
<div class="toast" id="toast" aria-live="polite"></div>

<script src="coach.js"></script>
<script>
(function(){
let EX = [], byId = {};

/* Animaciones y miniaturas: se piden una a una al repositorio del dataset (versión fija);
   el service worker (sw.js) las guarda en el celular, así cada imagen se descarga una sola vez. */
const MEDIA = 'https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/7455efae41b330c265e7cd4b78dfa848e7ce5ebd/';
const thumbUrl = e => MEDIA + 'images/' + e.m + '.jpg';
const gifUrl = e => MEDIA + 'videos/' + e.m + '.gif';
const thumbObserver = 'IntersectionObserver' in window ? new IntersectionObserver(entries=>{
  for(const en of entries){ if(en.isIntersecting){ thumbObserver.unobserve(en.target); loadThumb(en.target); } }
}, {rootMargin:'300px'}) : null;
function loadThumb(img){
  const e = byId[img.dataset.th]; if(!e) return;
  img.onload = () => img.classList.add('ok');
  img.crossOrigin = 'anonymous';
  img.src = thumbUrl(e);
}

/* Almacenamiento: imágenes guardadas por el service worker (caché "migym-media-v1") */
const MEDIA_CACHE = 'migym-media-v1';
async function mediaStats(){
  if(!('caches' in window) || !(await caches.has(MEDIA_CACHE))) return {gifs:0, thumbs:0, bytes:0};
  const c = await caches.open(MEDIA_CACHE), reqs = await c.keys();
  let gifs = 0, thumbs = 0, bytes = 0;
  for(const r of reqs){
    if(r.url.endsWith('.gif')) gifs++; else thumbs++;
    const res = await c.match(r);
    bytes += Number(res && res.headers.get('content-length')) || 0;
  }
  return {gifs, thumbs, bytes};
}
async function showMediaStats(){
  const el = $('#mediaInfo'); if(!el) return;
  const s = await mediaStats();
  if(!$('#mediaInfo')) return;
  const mb = s.bytes / 1048576;
  el.textContent = (s.gifs + s.thumbs)
    ? `${s.gifs} ${s.gifs===1?'animación':'animaciones'} y ${s.thumbs} miniatura${s.thumbs===1?'':'s'} guardadas · ${mb < 0.1 ? '<0,1' : mb.toFixed(1).replace('.', ',')} MB`
    : 'No hay animaciones guardadas.';
  $('#mediaClear').disabled = !(s.gifs + s.thumbs);
}
function hydrateThumbs(root){
  root.querySelectorAll('img[data-th]:not(.ok)').forEach(img => thumbObserver ? thumbObserver.observe(img) : loadThumb(img));
}

    favs:Array.isArray(s.favs)?s.favs:[],

}

const planById = id => state.plans.find(p=>p.id===id);

const lastDone = id => [...state.planLog].reverse().find(x=>x.id===id);

function nextPlan(){
  const main = state.plans.filter(p=>!p.opt);
  if(!main.length) return state.plans[0] || null;
  const last = [...state.planLog].reverse().find(x=>main.some(p=>p.id===x.id));
  return last ? main[(main.findIndex(p=>p.id===last.id)+1) % main.length] : main[0];
}
function finishPlan(id, d = isoDate()){
  if(!state.planLog.some(x=>x.id===id && x.d===d)) state.planLog.push({id, d});
  state.planLog = state.planLog.sort((a,b)=>a.d.localeCompare(b.d)).slice(-100);
  save();
}

/* Semana de deporte: gimnasio y actividades, lunes a domingo */
function weekStrip(){
  const now = new Date(), mon = new Date(now);
  mon.setDate(now.getDate() - (now.getDay()+6)%7);
  const days = [...Array(7)].map((_,i)=>{ const t = new Date(mon); t.setDate(mon.getDate()+i); return isoDate(t); });
  const today = isoDate();
  const items = d => {
    const out = [], done = state.planLog.filter(x=>x.d===d).map(x=>planById(x.id)).filter(p=>p && p.kind!=='act');
    out.push(...done.map(p=>p.name));
    if(!done.length && Object.keys(state.log).some(id=>sessions(id).some(x=>x.d===d))) out.push('Gimnasio');
    out.push(...state.acts.filter(a=>a.d===d).map(a=>actName(a)+(actText(a)?` ${actText(a)}`:'')));
    return out;
  };
  const info = days.map(d=>({d, it:items(d)})), n = info.filter(x=>x.it.length).length;
  return `<div class="wkstrip">
    <b>Esta semana: ${n} ${n===1?'día':'días'} de deporte</b>
    <div class="wkdays">${info.map((x,i)=>`<span class="wd ${x.it.length?'on':''} ${x.d===today?'today':''}" aria-label="${DAYS[i]}${x.it.length?': '+esc(x.it.join(', ')):''}">${'LMMJVSD'[i]}</span>`).join('')}</div>
    ${n?`<ul class="wklist">${info.map((x,i)=>x.it.length?`<li><b>${DAYS[i]}:</b> ${esc(x.it.join(' · '))}</li>`:'').join('')}</ul>`:''}
    <button class="btn sm" data-actnew>＋ Registrar actividad</button>
  </div>`;
}

/* ---------- Registro de entrenos ----------
   state.log[idEjercicio] = [{d:'AAAA-MM-DD', s:[{w:kg, r:reps} | {m:minutos}]}], ordenado por fecha */
const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const isoDate = (t = new Date()) => `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
const fmtDate = d => { const [, m, day] = d.split('-'); return `${+day} ${MONTHS[+m-1]}`; };
const fmtNum = n => String(Math.round(n*100)/100).replace('.', ',');
const logType = e => KIND[e.i] ? null : (e.c==='cardio' ? 'time' : 'weight');
const validSet = s => s.m>0 || s.w>0 || s.r>0;
const entryFor = (id, d) => (state.log[id]||[]).find(x => x.d===d);
const sessions = id => (state.log[id]||[]).map(x => ({d:x.d, s:x.s.filter(validSet), ...(x.n ? {n:x.n} : {})})).filter(x => x.s.length);
const lastBefore = (id, d) => sessions(id).filter(x => x.d<d).pop();
const setText = s => s.m>0 ? `${fmtNum(s.m)} min` : s.w>0 ? `${fmtNum(s.w)} kg${s.r>0?` × ${s.r}`:''}` : `${s.r} reps`;
const sessionText = x => x.s.map(setText).join(' · ');
const bestSet = x => x.s.reduce((a,b) => ((b.m||0)+(b.w||0)*1000+(b.r||0)/1000 > (a.m||0)+(a.w||0)*1000+(a.r||0)/1000 ? b : a));
function metric(id){
  const ss = sessions(id), e = byId[id];
  if(logType(e)==='time') return {title:'Minutos por sesión', unit:'min', pts:ss.map(x=>({d:x.d, v:x.s.reduce((a,s)=>a+(s.m||0),0)}))};
  if(ss.some(x=>x.s.some(s=>s.w>0))) return {title:'Mejor peso por sesión', unit:'kg', pts:ss.filter(x=>x.s.some(s=>s.w>0)).map(x=>({d:x.d, v:Math.max(...x.s.map(s=>s.w||0))}))};
  return {title:'Mejores repeticiones por sesión', unit:'reps', pts:ss.map(x=>({d:x.d, v:Math.max(...x.s.map(s=>s.r||0))}))};
}
function pruneLog(id){
  if(!state.log[id]) return;
  state.log[id] = sessions(id);
  if(!state.log[id].length) delete state.log[id];
  save();
}
function addSet(id, blank){
  const list = state.log[id] || (state.log[id] = []);
  let en = entryFor(id, logDate);
  if(!en){ en = {d:logDate, s:[]}; list.push(en); list.sort((a,b)=>a.d<b.d?-1:1); }
  const prev = blank ? null : en.s[en.s.length-1];
  en.s.push(logType(byId[id])==='time' ? {m:prev?prev.m:null} : {w:prev?prev.w:null, r:prev?prev.r:null});
  save();
}
/* ---------- Historial: todo lo hecho en un período ---------- */
const WEEKDAY = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const addDays = (d, n) => { const t = new Date(d+'T12:00'); t.setDate(t.getDate()+n); return isoDate(t); };
function dayLog(d){
  const ex = Object.keys(state.log).map(id=>({id, x:sessions(id).find(x=>x.d===d)})).filter(o=>o.x && byId[o.id]);
  const plans = state.planLog.filter(x=>x.d===d).map(x=>planById(x.id)).filter(p=>p && p.kind!=='act');
  const acts = state.acts.filter(a=>a.d===d);
  return {ex, plans, acts, gym:ex.length>0 || plans.length>0, any:ex.length>0 || plans.length>0 || acts.length>0};
}
function periodStats(from, to){
  const days = new Set(), gymDays = new Set();
  let sets = 0, kg = 0, min = 0, km = 0;
  for(const id of Object.keys(state.log)) for(const x of sessions(id)) if(x.d>=from && x.d<=to){
    days.add(x.d); gymDays.add(x.d); sets += x.s.length;
    for(const s of x.s){ kg += (s.w||0)*(s.r||0); min += s.m||0; }
  }
  for(const x of state.planLog) if(x.d>=from && x.d<=to){ const p = planById(x.id); if(p && p.kind!=='act'){ days.add(x.d); gymDays.add(x.d); } }
  for(const a of state.acts) if(a.d>=from && a.d<=to){ days.add(a.d); min += a.min||0; km += a.km||0; }
  return {days:days.size, gym:gymDays.size, sets, kg, min, km};
}
let histRange = 30, histMore = false;

        const out = d<from, l = logs[d];

/* Gráfico de línea: una serie, eje de fechas real, toque o cursor para leer cada punto */
function niceTicks(min, max){
  if(min===max){ min -= 1; max += 1; }
  const raw = (max-min)/3, pow = 10**Math.floor(Math.log10(raw));
  const step = [1,2,2.5,5,10].map(x=>x*pow).find(x=>x>=raw);
  const lo = Math.max(0, Math.floor(min/step)*step), hi = Math.ceil(max/step)*step, out = [];
  for(let v=lo; v<=hi+step/1000; v+=step) out.push(v);
  return out;
}
function lineChart(el, m){
  const pts = m.pts, W = Math.max(260, el.clientWidth||320), H = 170, L = 36, R = 14, T = 26, B = 24;
  const ticks = niceTicks(Math.min(...pts.map(p=>p.v)), Math.max(...pts.map(p=>p.v)));
  const lo = ticks[0], hi = ticks[ticks.length-1];
  const t0 = Date.parse(pts[0].d), t1 = Date.parse(pts[pts.length-1].d);
  const X = p => t1===t0 ? (L+W-R)/2 : L + (Date.parse(p.d)-t0)/(t1-t0)*(W-L-R);
  const Y = v => H-B - (v-lo)/(hi-lo)*(H-T-B);
  const end = pts[pts.length-1];
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.title)}: de ${fmtNum(pts[0].v)} a ${fmtNum(end.v)} ${m.unit}">
    ${ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmtNum(v)}</text>`).join('')}
    <text class="ax" x="${L}" y="${H-6}">${fmtDate(pts[0].d)}</text>
    ${pts.length>1?`<text class="ax" x="${W-R}" y="${H-6}" text-anchor="end">${fmtDate(end.d)}</text>`:''}
    <line class="xh" y1="${T}" y2="${H-B}" visibility="hidden"/>
    ${pts.length>1?`<polyline class="ln" points="${pts.map(p=>`${X(p)},${Y(p.v)}`).join(' ')}"/>`:''}
    <circle class="dot" cx="${X(end)}" cy="${Y(end.v)}" r="5"/>
    <circle class="dot cur" r="5" visibility="hidden"/>
    <text class="val" x="${Math.min(X(end), W-R)}" y="${Y(end.v)-11}" text-anchor="${pts.length>1?'end':'middle'}">${fmtNum(end.v)} ${m.unit}</text>
  </svg><div class="tip" hidden></div>`;
  const svg = el.firstElementChild, tip = el.querySelector('.tip'), xh = el.querySelector('.xh'), cur = el.querySelector('.cur');
  const show = ev => {
    const x = ev.clientX - svg.getBoundingClientRect().left;
    const p = pts.reduce((a,b) => Math.abs(X(b)-x) < Math.abs(X(a)-x) ? b : a);
    xh.setAttribute('x1', X(p)); xh.setAttribute('x2', X(p)); xh.setAttribute('visibility', 'visible');
    cur.setAttribute('cx', X(p)); cur.setAttribute('cy', Y(p.v)); cur.setAttribute('visibility', 'visible');
    tip.textContent = `${fmtDate(p.d)} · ${fmtNum(p.v)} ${m.unit}`; tip.hidden = false;
    tip.style.left = Math.max(0, Math.min(X(p) - tip.offsetWidth/2, W - tip.offsetWidth)) + 'px';
  };
  const hide = () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); cur.setAttribute('visibility', 'hidden'); };
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerleave', hide);
}
function sparkline(pts){
  if(pts.length<2) return '';
  const W = 72, H = 30, P = 5, vs = pts.map(p=>p.v), lo = Math.min(...vs), hi = Math.max(...vs);
  const t0 = Date.parse(pts[0].d), t1 = Date.parse(pts[pts.length-1].d);
  const X = p => P + (Date.parse(p.d)-t0)/((t1-t0)||1)*(W-2*P);
  const Y = v => hi===lo ? H/2 : H-P - (v-lo)/(hi-lo)*(H-2*P);
  const end = pts[pts.length-1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline class="ln" points="${pts.map(p=>`${X(p)},${Y(p.v)}`).join(' ')}"/><circle class="dot" cx="${X(end)}" cy="${Y(end.v)}" r="4"/></svg>`;
}

    ${m.pts.length?`<p class="small muted" style="margin:0 0 6px">${esc(m.title)}${m.pts.length<2?'. Registra otra sesión para ver la línea.':''}</p><div class="chart" id="chart"></div>`:''}
    <div class="lhist">${shown.map(x=>`<div class="lrow">
      <button class="info" data-editsess="${x.d}"><b>${fmtDate(x.d)}</b><span class="small muted">${esc(sessionText(x))}</span>${x.n?`<span class="small note">${esc(x.n)}</span>`:''}</button>
      ${logDel===x.d
        ? `<button class="btn sm pri" data-delsess="yes">Borrar</button><button class="btn sm" data-delsess="no">No</button>`
        : `<button class="ib" data-delsess="${x.d}" aria-label="Borrar sesión del ${fmtDate(x.d)}">✕</button>`}
    </div>`).join('')}</div>
    ${list.length>5?`<button class="btn sm" data-logall style="margin-top:8px">${logAll?'Ver menos':`Ver las ${list.length} sesiones`}</button>`:''}`;
  if(m.pts.length) lineChart($('#chart'), m);
}
function renderProgress(){
  const ids = Object.keys(state.log).filter(id => byId[id] && sessions(id).length)
    .sort((a,b) => sessions(b).pop().d.localeCompare(sessions(a).pop().d));
  if(!ids.length) return `${historyHTML()}${actsHTML()}<h2>Por ejercicio</h2><div class="empty">Todavía no hay registros de ejercicios.<br>Abre un ejercicio y anota tu peso y repeticiones en <b>Registrar</b>.</div>`;
  return `${historyHTML()}${actsHTML()}
    <h2>Por ejercicio</h2>
    <div class="list">${ids.map(id=>{
      const e = byId[id], ss = sessions(id), m = metric(id), last = ss[ss.length-1], p = m.pts;
      const diff = p.length>1 ? p[p.length-1].v - p[0].v : 0;
      return `<div class="ex" data-loghist="${id}" role="button" tabindex="0">
        <img class="th sm" data-th="${id}" alt="">
        <div class="info"><div class="nm">${esc(e.n)}</div>
          <div class="meta">${fmtDate(last.d)} · ${esc(setText(bestSet(last)))}</div>
          ${diff?`<div class="meta">${diff>0?'+':''}${fmtNum(diff)} ${m.unit} desde el inicio</div>`:''}</div>
        ${sparkline(p)}</div>`;
    }).join('')}</div>`;
}

/* ---------- Detalle ---------- */
let openId = null, pickOpen = false;
function openDetail(id, keep){
  const e = byId[id]; if(!e) return;
  if(!keep){ pickOpen = false; logDate = isoDate(); logDel = null; logAll = false; }
  openId = id;
  const k = KIND[id], rx = prescription(e);
  const t = k ? SPECIAL[k.kind].tips : (TIPS[e.t] || {do:[],avoid:[]});
  const extra = k ? [] : [...(EQ_TIPS[e.q] ? [EQ_TIPS[e.q]] : []), ...GENERAL_DO];
  const byPlan = state.routineMode==='sesiones';
  const slots = byPlan ? state.plans.map(p=>({key:p.id, label:`${planLabel(p)} · ${p.name}`, short:planLabel(p)})) : DAYS.map(d=>({key:d, label:d, short:d.slice(0,3)}));
  const inDays = slots.filter(s=>listOf(s.key).includes(id)), f = isFav(id);
  $('#sheetBox').innerHTML = `
    <div class="hd"><h3>${esc(e.n)}</h3><button class="x" data-close aria-label="Cerrar">✕</button></div>
    <div class="anim" id="anim"><span class="muted small" id="animMsg">Cargando animación…</span></div>
    <div class="tags">${k?`<span class="tag a">${esc(SPECIAL[k.kind].name)} · ${esc(k.group)}</span>`:''}<span class="tag ${k?'':'a'}">${esc(tr(TARGET,e.t))}</span><span class="tag">${esc(tr(EQUIP,e.q))}</span>${e.s.map(m=>`<span class="tag">${esc(tr(MUSCLE,m))}</span>`).join('')}</div>
    <div class="rx"><div><b>${rx.sets}</b><span>Series</span></div><div><b>${rx.reps}</b><span>${rx.unit}</span></div><div><b>${rx.rest}</b><span>${rx.restLabel||'Descanso'}</span></div></div>
    <div class="actions">
      <button class="btn pri" data-addr>${inDays.length?'En tu rutina: '+inDays.map(s=>s.short).join(', '):'＋ Añadir a rutina'}</button>
      <button class="btn" data-fav="${e.i}">${f?'★ Favorito':'☆ Favorito'}</button>
    </div>
    ${pickOpen?`<div class="dlg"><div class="muted small" style="margin-bottom:8px">Elige ${byPlan?'las sesiones':'los días'} (toca de nuevo para quitar):</div>
      <div class="seg">${slots.map(s=>`<button class="chip ${inDays.includes(s)?'on':''}" data-addday="${esc(s.key)}">${esc(s.label)}</button>`).join('')}</div></div>`:''}
    ${logType(e)?'<div id="logBox"></div>':''}
    <h4 class="sec">Cómo hacerlo</h4>
    <ol class="steps">${e.p.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
    <div class="tips"><h4>Consejos</h4><ul>${[...t.do, ...extra].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    ${t.avoid.length?`<div class="tips warn"><h4>Errores comunes</h4><ul>${t.avoid.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    <p class="muted small" style="margin-top:16px">Si sientes dolor (distinto de la fatiga muscular), detente. Consulta a un profesional si tienes lesiones. Animación © Gym visual.</p>`;
  if($('#sheet').hidden){ $('#sheet').hidden = false; $('#sheetBox').scrollTop = 0; document.body.style.overflow = 'hidden'; }
  renderLog(id);
  const img = new Image(); img.className = 'gif'; img.alt = 'Animación de ' + e.n; img.crossOrigin = 'anonymous';
  img.onload = () => { const box = $('#anim'); if(box && openId === id) box.replaceChildren(img); };
  img.onerror = () => { const m = $('#animMsg'); if(m && openId === id) m.textContent = 'No se pudo cargar la animación. Revisa tu conexión y vuelve a abrir el ejercicio.'; };
  img.src = gifUrl(e);
}
function closeDetail(){ if(openId) pruneLog(openId); $('#sheet').hidden = true; document.body.style.overflow = ''; openId = null; render(); }

/* ---------- Eventos ---------- */
const PRESETS = {
  casa:['body weight','dumbbell','band','resistance band','kettlebell','stability ball','roller'],
  gym:Object.keys(EQUIP).filter(q=>!['tire','hammer'].includes(q)),
  none:[]
};
document.addEventListener('click', ev=>{
  const el = ev.target.closest('[data-tab],[data-zone],[data-back],[data-target],[data-more],[data-open],[data-fav],[data-close],[data-addr],[data-addday],[data-rm],[data-up],[data-clear],[data-goal],[data-level],[data-eq],[data-preset],[data-backup],[data-media],[data-sub],[data-log],[data-loghist],[data-addset],[data-delset],[data-editsess],[data-delsess],[data-logall],[data-plopen],[data-plfinish],[data-plundo],[data-pledit],[data-plmove],[data-pldel],[data-pladd],[data-plweek],[data-plreview],[data-pladdex],[data-plfill],[data-plsort],[data-actnew],[data-acttype],[data-actedit],[data-actcancel],[data-actall],[data-actsave],[data-actdel],[data-pladdact],[data-hist],[data-histmore],[data-histday]');
  if(!el){ if(ev.target.id==='sheet') closeDetail(); return; }
  const d = el.dataset;
  if('fav' in d){
    ev.stopPropagation();
    const had = isFav(d.fav);
    state.favs = had ? state.favs.filter(x=>x!==d.fav) : [...state.favs, d.fav];
    save(); toast(had?'Quitado de favoritos':'Añadido a favoritos');
    if(openId) openDetail(openId, true); else render();
    return;
  }
  if('tab' in d){ view = {tab:d.tab, zone:null, target:'', equip:'', q:'', limit:40}; confirmClear=false; render(); scrollTo(0,0); return; }
  if('zone' in d){ Object.assign(view, {zone:d.zone, target:'', equip:'', q:'', limit:40}); render(); scrollTo(0,0); return; }
  if('back' in d){ view.zone = null; render(); return; }
  if('target' in d){ view.target = d.target; view.limit = 40; render(); return; }
  if('more' in d){ view.limit += 40; render(); return; }
  if('open' in d){ openDetail(d.open); return; }
  if('close' in d){ closeDetail(); return; }
  if('addr' in d){ pickOpen = !pickOpen; openDetail(openId, true); return; }
  if('addday' in d){
    const list = listOf(d.addday), i = list.indexOf(openId);
    if(i>=0){ list.splice(i,1); toast('Quitado de '+listName(d.addday)); }
    else { list.push(openId); toast('Añadido a '+listName(d.addday)); }
    save(); openDetail(openId, true); return;
  }
  if('rm' in d){ const [day,id] = d.rm.split('|'); const l = listOf(day), i = l.indexOf(id); if(i>=0) l.splice(i,1); save(); render(); return; }
  if('up' in d){ const [day,id] = d.up.split('|'); const l = listOf(day), i = l.indexOf(id); if(i>0){ [l[i-1],l[i]] = [l[i],l[i-1]]; save(); render(); } return; }
  if('clear' in d){
    if(d.clear==='ask') confirmClear = true;
    else { if(d.clear==='yes'){ state.routine = fresh().routine; save(); toast('Rutina vaciada'); } confirmClear = false; }
    render(); return;
  }
  if('goal' in d){ state.profile.goal = d.goal; save(); render(); return; }
  if('level' in d){ state.profile.level = d.level; save(); render(); return; }
  if('eq' in d){ const p = state.profile; p.equip = p.equip.includes(d.eq) ? p.equip.filter(x=>x!==d.eq) : [...p.equip, d.eq]; save(); render(); return; }
  if('actnew' in d){
    const p = d.actnew ? planById(d.actnew) : null;
    actForm = {type:p ? p.actType||'bici' : 'bici', d:isoDate(), min:null, km:null, note:'', ...(p?{plan:p.id}:{})}; actDel = false; actErr = '';
    if(p) planOpen = p.id;
    else if(view.tab!=='routine' || view.sub!=='progreso'){ view = {tab:'routine', sub:'progreso', zone:null, target:'', equip:'', q:'', limit:40}; }
    render(); const f = $('.actform'); if(f) f.scrollIntoView({block:'start'}); return;
  }
  if('acttype' in d){ actForm.type = d.acttype; render(); return; }
  if('actedit' in d){ const a = state.acts.find(x=>x.id===d.actedit); if(a){ actForm = {...a}; actDel = false; actErr = ''; render(); const f = $('.actform'); if(f) f.scrollIntoView({block:'start'}); } return; }
  if('actcancel' in d){ actForm = null; actErr = ''; render(); return; }
  if('actall' in d){ actAll = !actAll; render(); return; }
  if('hist' in d){ histRange = +d.hist; histMore = false; render(); return; }
  if('histmore' in d){ histMore = !histMore; render(); return; }
  if('histday' in d){ histMore = true; render(); const el = document.getElementById('day-'+d.histday); if(el) el.scrollIntoView({block:'start'}); return; }
  if('actsave' in d){
    const f = actForm;
    if(!(f.min>0) && !(f.km>0)){ actErr = 'Anota al menos los minutos o los kilómetros.'; render(); return; }
    const rec = {id:f.id || 'a'+Date.now(), d:f.d && f.d<=isoDate() ? f.d : isoDate(), type:f.type,
      ...(f.min>0?{min:f.min}:{}), ...(f.km>0?{km:f.km}:{}), ...(f.note&&f.note.trim()?{note:f.note.trim().slice(0,300)}:{}),
      ...(f.type==='otro'&&f.label&&f.label.trim()?{label:f.label.trim().slice(0,40)}:{})};
    const i = state.acts.findIndex(x=>x.id===rec.id);
    if(i>=0) state.acts[i] = rec; else state.acts.push(rec);
    /* si hay una sesión de ese tipo de actividad, queda marcada como hecha ese día */
    const plan = actPlanFor(rec.type, f.plan);
    if(plan) finishPlan(plan.id, rec.d);
    actForm = null; actErr = ''; save(); toast(plan ? `Actividad guardada en ${plan.name}` : 'Actividad guardada'); render(); return;
  }
  if('actdel' in d){
    if(d.actdel==='ask') actDel = true;
    else if(d.actdel==='no') actDel = false;
    else {
      const old = state.acts.find(x=>x.id===actForm.id);
      state.acts = state.acts.filter(x=>x.id!==actForm.id);
      const plan = old && actPlanFor(old.type, actForm.plan);
      if(plan && !state.acts.some(a=>a.d===old.d && actPlanFor(a.type)===plan))
        state.planLog = state.planLog.filter(x=>!(x.id===plan.id && x.d===old.d));
      actForm = null; actDel = false; save(); toast('Actividad borrada');
    }
    render(); return;
  }
  if('sub' in d){ view.sub = d.sub; if(d.sub!=='progreso'){ state.routineMode = d.sub; save(); } render(); return; }
  if('plopen' in d){ planOpen = d.plopen; planEdit = null; planDel = null; planReview = null; render(); return; }
  if('plweek' in d){ planWeek = !planWeek; render(); return; }
  if('plreview' in d){ planReview = planReview===d.plreview ? null : d.plreview; planEdit = null; render(); return; }
  if('pladdex' in d){
    const [pid, id] = d.pladdex.split('|'), p = planById(pid);
    if(p && !p.ids.includes(id)){ p.ids.push(id); save(); toast('Añadido a '+listName(pid)); }
    render(); return;
  }
  if('plfill' in d){
    const p = planById(d.plfill), r = Coach.review(p, coachCtx());
    const add = r.missing.map(m=>m.sugg[0]).filter(Boolean);
    p.ids.push(...add.filter((id,i)=>add.indexOf(id)===i));
    save(); toast('Sugerencias agregadas'); render(); return;
  }
  if('plsort' in d){ const p = planById(d.plsort); p.ids = Coach.review(p, coachCtx()).order; save(); toast('Sesión ordenada'); render(); return; }
  if('plfinish' in d){
    finishPlan(d.plfinish); planOpen = null; planEdit = null; render();
    const n = nextPlan(); toast(n ? `Listo. Próximo: ${n.name}` : 'Entreno terminado');
    return;
  }
  if('plundo' in d){
    const day = isoDate(); state.planLog = state.planLog.filter(x=>!(x.id===d.plundo && x.d===day)); save(); planOpen = d.plundo; render(); return;
  }
  if('pledit' in d){ planEdit = planEdit===d.pledit ? null : d.pledit; planDel = null; render(); return; }
  if('plmove' in d){ const i = state.plans.findIndex(p=>p.id===d.plmove); if(i>0){ [state.plans[i-1],state.plans[i]] = [state.plans[i],state.plans[i-1]]; save(); render(); } return; }
  if('pldel' in d){
    if(d.pldel==='no') planDel = null;
    else if(d.pldel==='yes'){
      state.plans = state.plans.filter(p=>p.id!==planDel); state.planLog = state.planLog.filter(x=>x.id!==planDel);
      planDel = null; planEdit = null; planOpen = null; save(); toast('Sesión borrada');
    } else planDel = d.pldel;
    render(); return;
  }
  if('pladdact' in d){
    const p = {id:'p'+Date.now(), name:'Bicicleta', kind:'act', actType:'bici', opt:true, ids:[]};
    state.plans.push(p); planOpen = p.id; planEdit = p.id; planDel = null; save(); render();
    toast('Día de actividad agregado'); return;
  }
  if('pladd' in d){
    const p = {id:'p'+Date.now(), name:'Nueva sesión', ids:[]};
    state.plans.push(p); planOpen = p.id; planEdit = p.id; planDel = null; save(); render();
    const n = document.getElementById('pn-'+p.id); if(n){ n.focus(); n.select(); }
    return;
  }
  if('log' in d){
    openDetail(d.log);
    if(!entryFor(d.log, logDate)){ addSet(d.log, true); renderLog(d.log); }
    $('#logBox').scrollIntoView({block:'start'});
    return;
  }
  if('loghist' in d){ openDetail(d.loghist); const h = $('#logHist'); if(h) h.scrollIntoView({block:'start'}); return; }
  if('addset' in d){
    addSet(openId); renderLog(openId);
    const inputs = document.querySelectorAll('.lsets input'); if(inputs.length) inputs[inputs.length - (logType(byId[openId])==='time'?1:2)].focus();
    return;
  }
  if('delset' in d){ const en = entryFor(openId, logDate); if(en){ en.s.splice(+d.delset, 1); save(); renderLog(openId); } return; }
  if('editsess' in d){ pruneLog(openId); logDate = d.editsess; logDel = null; renderLog(openId); $('#logBox').scrollIntoView({block:'start'}); return; }
  if('delsess' in d){
    if(d.delsess==='no') logDel = null;
    else if(d.delsess==='yes'){
      state.log[openId] = (state.log[openId]||[]).filter(x=>x.d!==logDel);
      logDel = null; pruneLog(openId); toast('Sesión borrada'); renderLog(openId); return;
    } else logDel = d.delsess;
    renderLogHist(openId); return;
  }
  if('logall' in d){ logAll = !logAll; renderLogHist(openId); return; }
  if('media' in d){
    if(d.media==='ask'){ mediaConfirm = true; render(); return; }
    mediaConfirm = false;
    if(d.media==='yes' && 'caches' in window){
      caches.delete(MEDIA_CACHE).then(()=>{ toast('Animaciones borradas'); render(); });
    } else render();
    return;
  }
  if('backup' in d){
    const msg = $('#backupMsg');
    if(d.backup==='copy'){
      const code = backupCode();
      navigator.clipboard.writeText(code).then(()=>toast('Código copiado'), ()=>{ const r=$('#restore'); r.value=code; r.select(); msg.textContent='Copia el código seleccionado.'; });
    } else {
      try{ restoreCode($('#restore').value); toast('Datos restaurados'); render(); }
      catch(_){ msg.textContent = 'Ese código no es válido. Cópialo completo desde el otro dispositivo.'; }
    }
    return;
  }
  if('preset' in d){ state.profile.equip = [...PRESETS[d.preset]]; state.profile.onlyMine = d.preset!=='none'; save(); render(); toast('Equipamiento actualizado'); return; }
});
document.addEventListener('keydown', ev=>{
  if(ev.key==='Escape' && openId) closeDetail();
  if((ev.key==='Enter'||ev.key===' ') && ev.target.matches('div[data-open],div[data-loghist]')){ ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('change', ev=>{
  const t = ev.target;
  if(t.matches('[data-equip]')){ view.equip = t.value; view.limit = 40; render(); }
  else if(t.matches('[data-plfocus]')){
    const p = planById(t.dataset.plfocus);
    if(p){
      if(t.value==='act'){ p.kind = 'act'; p.actType = p.actType || 'bici'; delete p.focus; }
      else { delete p.kind; p.focus = t.value; }
      save(); render();
    }
  }
  else if(t.matches('[data-plact]')){ const p = planById(t.dataset.plact); if(p){ p.actType = t.value; save(); render(); } }
  else if(t.matches('[data-plopt]')){ const p = planById(t.dataset.plopt); if(p){ p.opt = t.checked; save(); render(); } }
  else if(t.matches('[data-logdate]')){
    pruneLog(openId); logDate = (t.value && t.value<=isoDate()) ? t.value : isoDate(); logDel = null; renderLog(openId);
  }
  else if(t.matches('[data-onlymine]')){ state.profile.onlyMine = t.checked; save(); render(); }
  else if(t.matches('[data-done]')){
    const prefix = todayKey()+'|';
    for(const k of Object.keys(state.done)) if(!k.startsWith(prefix)) delete state.done[k];
    if(t.checked) state.done[t.dataset.done] = true; else delete state.done[t.dataset.done];
    save(); render();
  }
});
let qTimer, nameTimer;
document.addEventListener('input', ev=>{
  const t = ev.target;
  if(t.matches('[data-q]')){
    clearTimeout(qTimer);
    qTimer = setTimeout(()=>{ view.q = t.value; view.limit = 40; const pos = t.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos,pos); }, 200);
  } else if(t.matches('[data-gq]')){
    view = {tab:'explore', zone:null, target:'', equip:'', q:t.value, limit:40}; render();
    const n = $('#q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length);
  } else if(t.matches('[data-plname]')){
    const p = planById(t.dataset.plname); if(p){ p.name = t.value; save(); }
  } else if(t.matches('[data-actf]') && actForm){
    const k = t.dataset.actf;
    if(k==='min' || k==='km'){ const v = parseFloat(t.value); actForm[k] = Number.isFinite(v) && v>=0 ? v : null; }
    else actForm[k] = t.value;
  } else if(t.matches('[data-lnote]')){
    /* la nota se guarda junto a las series de ese día; sin series, se descarta al cerrar */
    const list = state.log[openId] || (state.log[openId] = []);
    let en = entryFor(openId, logDate);
    if(!en){ en = {d:logDate, s:[]}; list.push(en); list.sort((a,b)=>a.d<b.d?-1:1); }
    const v = t.value.trim(); if(v) en.n = t.value.slice(0,300); else delete en.n;
    save(); renderLogHist(openId);
  } else if(t.matches('[data-lw],[data-lr],[data-lm]')){
    const en = entryFor(openId, logDate), s = en && en.s[+(t.dataset.lw ?? t.dataset.lr ?? t.dataset.lm)];
    if(!s) return;
    const v = parseFloat(t.value), n = Number.isFinite(v) && v>=0 ? v : null;
    if('lw' in t.dataset) s.w = n; else if('lr' in t.dataset) s.r = n===null ? null : Math.round(n); else s.m = n;
    save(); renderLogHist(openId);
  } else if(t.matches('[data-pname]')){
    state.profile.name = t.value; saveLocal(); clearTimeout(nameTimer); nameTimer = setTimeout(save, 600);
  }
});

/* ---------- Arranque ---------- */
fetch('data.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(data=>{
  EX = data; byId = Object.fromEntries(EX.map(e=>[e.i, e])); render();
}).catch(()=>{ app.innerHTML = '<div class="empty">No se pudieron cargar los ejercicios. Recarga la página para intentarlo de nuevo.</div>'; });
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
})();
</script>
